<div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:76px 24px 48px;box-sizing:border-box">

<script>
(function () {
  var ICON = {
    REPORT: 'M4 1.8h5.2L12.5 5v9.2H4z M9 1.8V5.2h3.5 M6 8.2h4.5 M6 10.8h4.5',
    FIORI: 'M2 13.5h12 M3.5 11l3-3.5 2.5 2 4-5',
    DATA: 'M3 3.8c0-1.1 2.2-2 5-2s5 .9 5 2-2.2 2-5 2-5-.9-5-2z M3 3.8v8.4c0 1.1 2.2 2 5 2s5-.9 5-2V3.8 M3 8c0 1.1 2.2 2 5 2s5-.9 5-2',
    CODE: 'M5.5 4L2 8l3.5 4 M10.5 4L14 8l-3.5 4 M9 2.5L7 13.5',
    AUTO: 'M6 12.5h4 M6.5 14.5h3 M8 1.8a4.2 4.2 0 0 0-2.5 7.6c.5.4.8.9.8 1.6h3.4c0-.7.3-1.2.8-1.6A4.2 4.2 0 0 0 8 1.8z'
  };
  var D = {
    layers: 'M8 1.8l6.2 3.2L8 8.2 1.8 5z M1.8 8L8 11.2 14.2 8 M1.8 11L8 14.2 14.2 11',
    down: 'M4.5 6.5L8 10l3.5-3.5',
    up: 'M4.5 9.5L8 6l3.5 3.5',
    right: 'M6.5 4L10 8l-3.5 4',
    x: 'M4.5 4.5l7 7 M11.5 4.5l-7 7',
    check: 'M3.5 8.5l3 3 6-6.5',
    info: 'M8 1.8a6.2 6.2 0 1 0 0 12.4A6.2 6.2 0 0 0 8 1.8z M8 7.3v4 M8 5v.3',
    search: 'M7 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z M10.3 10.3L13.5 13.5',
    list: 'M5.5 4h8 M5.5 8h8 M5.5 12h8 M2.5 4h.5 M2.5 8h.5 M2.5 12h.5'
  };
  function svg(d, size, sw, stroke, style) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 16 16" fill="none" stroke="' + (stroke || 'currentColor') +
      '" stroke-width="' + (sw || 1.4) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' +
      (style ? ' style="' + style + '"' : '') + '><path d="' + d + '"></path></svg>';
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function $(id) { return document.getElementById(id); }

  var SCENES = [
    { key: 'REPORT', label: '报表执行', sub: '选报表、填参数、后台执行；结果出来后可以直接追问分析', ph: '要执行哪张报表？例如「执行 ZDPMM702」；也可以直接在下方目录里点选' },
    { key: 'FIORI', label: 'Fiori 报表', sub: '从报表目录选 Fiori 报表、填参数、实时取数；需要时再交给模型分析', ph: '说报表名或业务，例如「出货」；也可以直接在下方目录里点选' },
    { key: 'DATA', label: '数据分析', sub: '按表 / SQL 只读取数与统计分析，不会触发任何报表执行', ph: '想分析哪张表、按什么维度？例如「按工厂统计 ZIDPMM455」' },
    { key: 'CODE', label: '代码分析', sub: '读取自开发程序源码与表结构，解读逻辑、审查代码', ph: '想看哪个程序、事务码或类？例如「解释 ZDPMM702 的程序逻辑」' },
    { key: 'AUTO', label: '自动', sub: '按每句话自动判断用哪类工具（混合场景，适合熟悉的用户）', ph: '描述你要做的事，Agent 会按每句话自动选工具' }
  ];
  var SKILLS = {
    CODE: [
      { id: 'perf', name: '性能审查', ver: 'v3', tools: '读源码 · 表结构', desc: '按清单逐项查 LOOP 内 SELECT、FOR ALL ENTRIES 空表、SELECT * 等，按严重程度出表', ph: '给出程序名或事务码，例如「ZRMM_IDP_0702」，按性能清单逐项审查',
        body: '【步骤】\n1. 先读源码，按子程序 / 方法记下所有数据库访问的位置\n2. 逐项检查：LOOP 内 SELECT、嵌套 LOOP、FOR ALL ENTRIES 前没判空、SELECT *、WHERE 没用上主键或索引、同一张表重复读取\n3. 要确认索引时，用表结构工具查主键和索引字段\n\n【输出】\n按严重程度（高 / 中 / 低）出表：位置、问题、建议\n没发现问题的检查项，最后用一句话带过\n\n【自查】\n每条问题都能对应到具体行号；没读到的代码不下结论' },
      { id: 'explain', name: '代码解读', ver: 'v2', tools: '读源码', desc: '先讲整体流程，再按子程序 / 方法拆开讲，最后列出读写了哪些表', ph: '给出程序名或事务码，先讲整体流程，再拆子程序' },
      { id: 'exit', name: '增强出口定位', ver: 'v1', tools: '读源码', desc: '找出程序里的 BAdI、用户出口和隐式增强点，并说明各自用途', ph: '给出程序名或事务码，找出其中的 BAdI、用户出口和隐式增强' },
      { id: 's4', name: '升级影响评估', ver: 'v1', tools: '读源码 · 表结构', desc: '检查 S/4 不兼容写法和受影响的表（如 MKPF/MSEG → MATDOC），给出改动清单', ph: '给出程序名，检查 S/4 不兼容写法与受影响的表' }
    ],
    DATA: [
      { id: 'po', name: '采购未清分析', ver: 'v2', tools: '找表 · 表结构 · SQL', desc: '按 EKKO/EKPO/EKET 取数，未清 = 订单量 − 已收货量，按供应商和逾期天数分层', ph: '说明范围，例如「工厂 1000 本月到期的采购未清」' },
      { id: 'mdq', name: '主数据质检', ver: 'v1', tools: '表结构 · SQL', desc: '检查 MARA/MARC 关键字段缺失、重复和异常值，按问题类型汇总', ph: '说明物料范围，例如「工厂 1000 的成品物料」' },
      { id: 'multi', name: '多维统计报告', ver: 'v1', tools: '表结构 · SQL', desc: '多个维度合成一条 UNION ALL 取数，结果用表格加占比呈现', ph: '说明表和维度，例如「ZIDPMM455 按工厂、事务码统计」' }
    ],
    REPORT: [
      { id: 'dem', name: '需求结构分析', ver: 'v1', tools: '只用报表结果', desc: '按工厂、物料组拆分需求，找出集中度最高的部分', ph: '先执行报表；结果出来后会按「需求结构分析」的做法分析' },
      { id: 'cmp', name: '两次结果对比', ver: 'v1', tools: '只用报表结果', desc: '对比同一报表两次执行的结果，列出新增、消失和变化最大的行', ph: '先执行报表；结果出来后会按「两次结果对比」的做法分析' }
    ],
    FIORI: [
      { id: 'ship', name: '出货异常分析', ver: 'v1', tools: '只用取数结果', desc: '按客户和延迟天数分层，列出延迟最多的订单', ph: '先取数；交给模型分析时按「出货异常分析」的做法' }
    ],
    AUTO: []
  };

  var state = { scene: 'CODE', open: false, sel: null, q: '', hi: 0, body: false };
  var start = (location.hash || '').replace('#', '').toUpperCase();
  if (SKILLS[start]) state.scene = start;

  function cur() { return SCENES.filter(function (o) { return o.key === state.scene; })[0]; }
  function list() { return SKILLS[state.scene] || []; }
  function selSkill() { var id = state.sel; return list().filter(function (k) { return k.id === id; })[0] || null; }
  function filtered() {
    var q = state.q.trim().toLowerCase();
    if (!q) return list();
    return list().filter(function (k) { return (k.name + k.desc + k.tools).toLowerCase().indexOf(q) >= 0; });
  }
  function isAuto() { return state.scene === 'AUTO'; }
  function isRpt() { return state.scene === 'REPORT' || state.scene === 'FIORI'; }

  function scenesHtml() {
    return SCENES.map(function (o) {
      var on = o.key === state.scene;
      return '<button data-act="scene" data-v="' + o.key + '" aria-pressed="' + on + '" style="height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;' +
        'border:1px solid ' + (on ? '#2563EB' : '#D9DDE3') + ';background:' + (on ? '#EEF3FE' : '#FFFFFF') + ';color:' + (on ? '#2563EB' : '#4B5563') +
        ';font-size:12.8px;font-weight:' + (on ? 600 : 400) + '">' + svg(ICON[o.key], 14) + o.label + '</button>';
    }).join('');
  }

  function slotHtml() {
    var sel = selSkill();
    if (isAuto()) {
      return '<button disabled title="自动场景不能用技能，先选具体场景" style="height:31px;display:flex;align-items:center;gap:6px;padding:0 11px;border-radius:999px;border:1px dashed #C4C9D1;background:transparent;color:#6B7280;font-size:12.5px;font-weight:500;opacity:.7;cursor:not-allowed">' +
        svg(D.layers, 14) + '技能</button>';
    }
    if (sel) {
      return '<span style="height:31px;box-sizing:border-box;display:inline-flex;align-items:center;border-radius:999px;border:1px solid #2563EB;background:#EEF3FE;color:#1D4ED8">' +
        '<button data-act="toggle" aria-haspopup="dialog" aria-expanded="' + state.open + '" style="height:29px;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:6px;padding:0 4px 0 11px;font-size:12.5px;font-weight:600">' +
        svg(D.layers, 14) + esc(sel.name) + '</button>' +
        '<button data-act="clear" aria-label="不用这个技能" style="width:27px;height:29px;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;border-radius:0 999px 999px 0">' +
        svg(D.x, 12, 1.7) + '</button></span>';
    }
    var o = state.open;
    return '<button data-act="toggle" class="' + (o ? '' : 'pill') + '" aria-haspopup="dialog" aria-expanded="' + o + '" title="选一个做法，Agent 按它来回答" style="height:31px;display:flex;align-items:center;gap:6px;padding:0 9px 0 11px;border-radius:999px;' +
      'border:1px solid ' + (o ? '#2563EB' : '#E6E8EC') + ';background:' + (o ? '#EEF3FE' : 'transparent') + ';color:' + (o ? '#1D4ED8' : '#4B5563') + ';font-size:12.5px;font-weight:500">' +
      svg(D.layers, 14) + '技能' + svg(o ? D.up : D.down, 12, 1.6) + '</button>';
  }

  function listHtml() {
    var items = filtered();
    if (!items.length) {
      return '<div style="padding:18px 10px;text-align:center;font-size:12.5px;color:#6B7280">没有匹配的技能</div>';
    }
    var sel = selSkill();
    return items.map(function (k, i) {
      var on = sel && sel.id === k.id;
      var bg = i === state.hi ? '#F2F4F7' : (on ? '#F3F7FF' : 'transparent');
      return '<button data-act="pick" data-v="' + k.id + '" class="hov" style="display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:10px;padding:9px 10px;background:' + bg + ';width:100%">' +
        '<span style="flex:none;width:30px;height:30px;border-radius:8px;background:#EEF3FE;color:#2563EB;display:flex;align-items:center;justify-content:center">' + svg(D.layers, 15) + '</span>' +
        '<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">' +
        '<span style="display:flex;align-items:center;gap:6px"><span style="font-size:13.5px;font-weight:600;color:#111827">' + esc(k.name) + '</span>' +
        '<span style="font-size:10.5px;color:#4B5563;border:1px solid #E6E8EC;border-radius:5px;padding:0 4px;line-height:16px">' + k.ver + '</span></span>' +
        '<span style="font-size:12px;color:#4B5563;line-height:17px">' + esc(k.desc) + '</span>' +
        '<span style="font-size:11.5px;color:#6B7280">工具：' + esc(k.tools) + '</span></span>' +
        (on ? '<span style="color:#2563EB;flex:none;margin-top:7px">' + svg(D.check, 15, 1.8) + '</span>' : '') +
        '</button>';
    }).join('');
  }

  function popoverHtml() {
    if (!state.open || isAuto()) return '';
    return '<div role="dialog" aria-label="选择技能" style="position:absolute;left:14px;top:calc(100% + 8px);width:410px;max-width:calc(100% - 28px);background:#FFFFFF;border:1px solid #E6E8EC;border-radius:14px;box-shadow:0 14px 36px rgba(17,24,39,.13),0 2px 6px rgba(17,24,39,.06);z-index:10;overflow:hidden">' +
      '<div style="padding:10px 10px 4px"><div style="position:relative">' +
      '<label class="sr" for="skillSearch">搜索技能</label>' +
      svg(D.search, 14, 1.5, '#4B5563', 'position:absolute;left:11px;top:10px') +
      '<input id="skillSearch" placeholder="搜索技能" autocomplete="off" style="width:100%;height:34px;box-sizing:border-box;border:1px solid #E6E8EC;border-radius:9px;padding:0 10px 0 32px;font-size:13px;background:#F7F8FA;color:#111827">' +
      '</div><div style="display:flex;justify-content:space-between;margin:10px 4px 4px;font-size:11.5px;color:#6B7280"><span>' + cur().label + ' · ' + list().length + ' 个技能</span><span>↑↓ 选择 · Enter 使用 · Esc 关闭</span></div></div>' +
      (isRpt() ? '<div style="margin:0 10px 6px;padding:8px 10px;border-radius:9px;background:#FFF6E5;color:#7A4E00;font-size:12px;line-height:17px;display:flex;gap:6px;align-items:flex-start">' +
        svg(D.info, 14, 1.4, 'currentColor', 'flex:none;margin-top:1px') + '报表类场景的执行和取数是固定流程，技能只在「交给模型分析结果」这一步生效</div>' : '') +
      '<div id="skillList" style="padding:0 6px 6px;display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto">' + listHtml() + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid #EDEFF2;background:#FAFBFC;font-size:11.5px;color:#6B7280">' +
      '<span style="display:flex;align-items:center;gap:6px">' + svg(D.info, 13) + '技能只改变做法，不增加工具和权限</span>' +
      '<a href="08-设置-技能管理.html" style="font-size:12px;font-weight:500;text-decoration:none">管理技能</a></div></div>';
  }

  function hintHtml() {
    var sel = selSkill();
    if (!sel || isAuto()) return '';
    var when = isRpt() ? '分析结果时按「' + esc(sel.name) + ' ' + sel.ver + '」的做法' : '本任务按「' + esc(sel.name) + ' ' + sel.ver + '」的做法回答，只用' + esc(sel.tools.replace(/ · /g, '、')) + '；追问也沿用';
    var body = sel.body || ('【做法】\n' + sel.desc);
    return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 6px 0;font-size:12px;color:#4B5563">' +
      '<span style="display:flex;align-items:center;gap:6px">' + svg(D.layers, 13, 1.4, '#2563EB') + when + '</span>' +
      '<button data-act="body" style="border:0;background:transparent;color:#2563EB;font-size:12px;font-weight:500;padding:2px 0">' + (state.body ? '收起做法' : '查看做法') + '</button></div>' +
      (state.body ? '<div style="margin:8px 0 0;padding:12px 14px;border:1px solid #E6E8EC;border-radius:12px;background:#FFFFFF;font-size:12.5px;line-height:20px;color:#111827;white-space:pre-wrap">' + esc(body) + '</div>' : '');
  }

  function belowHtml() {
    if (isAuto()) {
      return '<p style="margin:22px 0 0;font-size:12.5px;color:#6B7280;display:flex;gap:6px;align-items:center;text-align:center">' +
        svg(D.info, 14, 1.4, 'currentColor', 'flex:none') + '自动场景每句话分到的领域不同，技能不可用；先选上面的具体场景再用</p>';
    }
    if (isRpt()) {
      return '<button style="margin-top:22px;height:32px;border:1px solid #E6E8EC;border-radius:999px;background:#FFFFFF;padding:0 14px;font-size:12.5px;color:#111827;font-weight:600;display:flex;align-items:center;gap:6px">' +
        svg(D.list, 14, 1.5, '#2563EB') + '报表目录<span style="color:#6B7280;font-weight:400">共 3 张</span>' + svg(D.down, 12, 1.6, '#4B5563') + '</button>';
    }
    var sel = selSkill();
    var cards = list().slice(0, 3).map(function (k) {
      var on = sel && sel.id === k.id;
      return '<button data-act="card" data-v="' + k.id + '" class="card" style="text-align:left;background:' + (on ? '#F5F8FF' : '#FFFFFF') + ';border:1px solid ' + (on ? '#2563EB' : '#E6E8EC') +
        ';border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0">' +
        '<span style="display:flex;justify-content:space-between;align-items:center;width:100%"><span style="width:28px;height:28px;border-radius:8px;background:' + (on ? '#DCE6FB' : '#EEF3FE') + ';color:#2563EB;display:flex;align-items:center;justify-content:center">' + svg(D.layers, 15) + '</span>' +
        (on ? '<span style="font-size:11px;font-weight:600;color:#1D4ED8;background:#DCE6FB;border-radius:999px;padding:2px 8px">使用中</span>' : '') + '</span>' +
        '<span style="font-size:14px;font-weight:600;color:#111827">' + esc(k.name) + '</span>' +
        '<span style="font-size:12.5px;line-height:18px;color:#4B5563">' + esc(k.desc) + '</span>' +
        '<span style="font-size:11.5px;color:#6B7280">工具：' + esc(k.tools) + '</span></button>';
    }).join('');
    return '<div style="width:100%;margin-top:22px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px"><span style="font-size:12.5px;color:#4B5563;font-weight:600">' + cur().label + ' · 常用技能</span>' +
      '<button data-act="toggle" style="border:0;background:transparent;color:#2563EB;font-size:12.5px;display:flex;align-items:center;gap:2px;padding:4px">全部 ' + list().length + ' 个' + svg(D.right, 12, 1.6) + '</button></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">' + cards + '</div></div>';
  }

  function render() {
    var c = cur();
    var sel = selSkill();
    if (isAuto()) state.open = false;
    $('crumb').textContent = '✦ Agent · ' + c.label;
    $('sceneSub').textContent = c.sub;
    $('task').placeholder = sel ? sel.ph : c.ph;
    $('scenes').innerHTML = scenesHtml();
    $('skillSlot').innerHTML = slotHtml();
    $('popover').innerHTML = popoverHtml();
    $('hint').innerHTML = hintHtml();
    $('below').innerHTML = belowHtml();
    var hasText = $('task').value.trim() && $('task').value.trim() !== '/';
    $('send').style.background = hasText ? '#2563EB' : '#A9C2F8';
  }

  function openPopover() {
    state.open = true; state.q = ''; state.hi = 0;
    render();
  }
  function pick(id) {
    state.sel = id; state.open = false; state.body = false;
    var ta = $('task');
    if (ta.value.charAt(0) === '/') ta.value = '';
    render();
    ta.focus();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) {
      if (state.open && !e.target.closest('#popover') && e.target.id !== 'task') { state.open = false; render(); }
      return;
    }
    var a = t.getAttribute('data-act'), v = t.getAttribute('data-v');
    if (a === 'scene') {
      state.scene = v; state.sel = null; state.open = false; state.body = false;
      if (history.replaceState) history.replaceState(null, '', '#' + v);
      render();
    } else if (a === 'toggle') {
      if (state.open) { state.open = false; render(); } else { openPopover(); var s = $('skillSearch'); if (s) s.focus(); }
    } else if (a === 'pick') {
      pick(v);
    } else if (a === 'card') {
      state.sel = state.sel === v ? null : v; state.open = false; state.body = false; render();
    } else if (a === 'clear') {
      state.sel = null; state.open = false; state.body = false; render();
    } else if (a === 'body') {
      state.body = !state.body; render();
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'skillSearch') {
      state.q = e.target.value; state.hi = 0;
      $('skillList').innerHTML = listHtml();
    } else if (e.target.id === 'task') {
      if (e.target.value === '/' && !isAuto() && !state.open) openPopover();
      else if (state.open && e.target.value.charAt(0) === '/') { state.q = e.target.value.slice(1); state.hi = 0; $('skillList').innerHTML = listHtml(); }
      else render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!state.open) return;
    var items = filtered();
    if (e.key === 'Escape') { state.open = false; render(); $('task').focus(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); state.hi = Math.min(state.hi + 1, items.length - 1); $('skillList').innerHTML = listHtml(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); state.hi = Math.max(state.hi - 1, 0); $('skillList').innerHTML = listHtml(); }
    else if (e.key === 'Enter' && items[state.hi]) { e.preventDefault(); pick(items[state.hi].id); }
  });

  render();
})();
</script>
</body>
</html>
