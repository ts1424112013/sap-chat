<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能选择弹层</title>
<style>
body{margin:0;background:#F7F8FA}
a{color:#2563EB}a:hover{color:#1D4ED8}
button,input,textarea{font-family:inherit}
textarea::placeholder,input::placeholder{color:#6B7280}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){.side{max-width:none !important}}
</style>
</head>
<body>

<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:#F7F8FA;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">

<aside class="side" style="flex:1 1 288px;max-width:288px;box-sizing:border-box;background:#F2F4F7;border-right:1px solid #E6E8EC;padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px;padding:2px 6px">
<svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><path d="M30 12A12 12 0 1 0 32 23H21" fill="none" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round"></path><path d="M25 25l6 8" fill="none" stroke="#7C5CFF" stroke-width="4.5" stroke-linecap="round"></path></svg>
<span style="font-size:16px;font-weight:700">Gale-SAP</span>
</div>
<div style="display:flex;gap:4px;padding:4px;background:#E7EAEE;border-radius:12px">
<button style="flex:1;height:32px;border:0;border-radius:9px;background:transparent;color:#4B5563;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"></path></svg>对话</button>
<button aria-pressed="true" style="flex:1;height:32px;border:0;border-radius:9px;background:#FFFFFF;box-shadow:0 1px 2px rgba(17,24,39,.08);color:#111827;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5h4 M6.5 14.5h3 M8 1.8a4.2 4.2 0 0 0-2.5 7.6c.5.4.8.9.8 1.6h3.4c0-.7.3-1.2.8-1.6A4.2 4.2 0 0 0 8 1.8z"></path></svg>Agent</button>
</div>
<button style="height:38px;border:1px solid #D9DDE3;border-radius:10px;background:#FFFFFF;font-size:13px;font-weight:600;color:#111827;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10 M3 8h10"></path></svg>新建任务</button>
<div style="font-size:11.5px;color:#6B7280;padding:4px 4px 0">Agent 会话</div>
<div style="position:relative">
<label class="sr" for="popSessSearch">搜索会话</label>
<input id="popSessSearch" placeholder="搜索会话标题..." style="width:100%;box-sizing:border-box;height:34px;border:1px solid #E6E8EC;border-radius:10px;padding:0 30px 0 10px;font-size:12.5px;background:#FFFFFF;color:#111827">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="position:absolute;right:10px;top:10px"><path d="M7 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z M10.3 10.3L13.5 13.5"></path></svg>
</div>
<p style="margin:6px 0 0;text-align:center;font-size:11.5px;color:#6B7280">暂无历史会话，发送第一条消息后自动保存</p>
<div style="flex:1"></div>
<div style="border-top:1px solid #E6E8EC;padding-top:8px;display:flex;flex-direction:column;gap:2px">
<button style="height:32px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12.5px;color:#111827"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M10 2.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z M7.5 8.5L2.5 13.5 M4 12l1.5 1.5 M5.5 10.5L7 12"></path></svg>申请权限</button>
<button style="height:32px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12.5px;color:#111827"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5h6v2H5z M4 3.5H3v10h10v-10h-1 M5.5 8l1.8 1.8L10.5 6.5"></path></svg>权限审批</button>
</div>
<div style="display:flex;align-items:center;gap:10px;border-top:1px solid #E6E8EC;padding:10px 4px 0">
<span style="width:30px;height:30px;border-radius:50%;background:#DCE6FB;color:#1D4ED8;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">AD</span>
<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">管理员</div><div style="font-size:11px;color:#6B7280;display:flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:#F5A524"></span>演示模式</div></div>
<button aria-label="设置" style="width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#4B5563;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z M8 1.5v1.8 M8 12.7v1.8 M1.5 8h1.8 M12.7 8h1.8 M3.4 3.4l1.3 1.3 M11.3 11.3l1.3 1.3 M3.4 12.6l1.3-1.3 M11.3 4.7l1.3-1.3"></path></svg></button>
</div>
</aside>

<main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
<div style="height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #EDEFF2">
<div style="display:flex;align-items:center;gap:10px">
<button aria-label="收起侧栏" style="width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#4B5563;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11 M2.5 8h11 M2.5 12h11"></path></svg></button>
<span style="font-size:12.5px;color:#4B5563">✦ Agent · 代码分析</span>
</div>
<div style="display:flex;gap:4px">
<button aria-label="切换暗色" style="width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#4B5563;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"></path></svg></button>
<button aria-label="导出" style="width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#4B5563;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8 M4.5 7L8 10.5 11.5 7 M3 13.5h10"></path></svg></button>
</div>
</div>

<div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:76px 24px 48px;box-sizing:border-box">
<svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><path d="M30 12A12 12 0 1 0 32 23H21" fill="none" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round"></path><path d="M25 25l6 8" fill="none" stroke="#7C5CFF" stroke-width="4.5" stroke-linecap="round"></path></svg>
<h1 style="margin:16px 0 0;font-size:30px;font-weight:700;letter-spacing:-0.01em;text-align:center">今天想让 Agent 做什么？</h1>
<p style="margin:10px 0 0;font-size:14.5px;color:#6B7280;text-align:center">读取自开发程序源码与表结构，解读逻辑、审查代码</p>

<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px">
<button style="height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;border:1px solid #D9DDE3;background:#FFFFFF;color:#4B5563;font-size:12.8px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.8h5.2L12.5 5v9.2H4z M9 1.8V5.2h3.5 M6 8.2h4.5 M6 10.8h4.5"></path></svg>报表执行</button>
<button style="height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;border:1px solid #D9DDE3;background:#FFFFFF;color:#4B5563;font-size:12.8px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13.5h12 M3.5 11l3-3.5 2.5 2 4-5"></path></svg>Fiori 报表</button>
<button style="height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;border:1px solid #D9DDE3;background:#FFFFFF;color:#4B5563;font-size:12.8px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3.8c0-1.1 2.2-2 5-2s5 .9 5 2-2.2 2-5 2-5-.9-5-2z M3 3.8v8.4c0 1.1 2.2 2 5 2s5-.9 5-2V3.8 M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"></path></svg>数据分析</button>
<button aria-pressed="true" style="height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;border:1px solid #2563EB;background:#EEF3FE;color:#2563EB;font-size:12.8px;font-weight:600"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4L2 8l3.5 4 M10.5 4L14 8l-3.5 4 M9 2.5L7 13.5"></path></svg>代码分析</button>
<button style="height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;border:1px solid #D9DDE3;background:#FFFFFF;color:#4B5563;font-size:12.8px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5h4 M6.5 14.5h3 M8 1.8a4.2 4.2 0 0 0-2.5 7.6c.5.4.8.9.8 1.6h3.4c0-.7.3-1.2.8-1.6A4.2 4.2 0 0 0 8 1.8z"></path></svg>自动</button>
</div>

<div style="position:relative;width:100%;max-width:820px;margin-top:16px">
<div style="background:#FFFFFF;border:1px solid #D9DDE3;border-radius:18px;box-shadow:0 2px 12px rgba(17,24,39,.05);padding:12px 13px 10px 18px">
<label class="sr" for="popTask">任务输入</label>
<textarea id="popTask" rows="2" placeholder="想看哪个程序、事务码或类？例如「解释 ZDPMM702 的程序逻辑」" style="display:block;width:100%;box-sizing:border-box;border:0;outline:none;resize:none;font-size:15px;line-height:22px;padding:8px 2px;color:#111827;background:transparent"></textarea>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<button aria-haspopup="dialog" aria-expanded="true" style="height:31px;display:flex;align-items:center;gap:6px;padding:0 9px 0 11px;border-radius:999px;border:1px solid #2563EB;background:#EEF3FE;color:#1D4ED8;font-size:12.5px;font-weight:500"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l6.2 3.2L8 8.2 1.8 5z M1.8 8L8 11.2 14.2 8 M1.8 11L8 14.2 14.2 11"></path></svg>技能<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9.5L8 6l3.5 3.5"></path></svg></button>
<button style="height:31px;display:flex;align-items:center;gap:6px;padding:0 9px 0 10px;border-radius:999px;border:1px solid #E6E8EC;background:transparent;color:#4B5563;font-size:12.5px;font-weight:500"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l1.5 5 5 1.5-5 1.5L8 14.5 6.5 9.5 1.5 8l5-1.5z" fill="#5B6CF0"></path></svg>智能路由<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg></button>
</div>
<div style="display:flex;align-items:center;gap:8px">
<button aria-label="添加附件" style="width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:#4B5563;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7.5l-5 5a3 3 0 0 1-4.2-4.2l5.4-5.4a2 2 0 0 1 2.8 2.8L6.8 11a1 1 0 0 1-1.4-1.4L10 5"></path></svg></button>
<button aria-label="发送" style="width:34px;height:34px;border:0;border-radius:50%;background:#A9C2F8;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2L7.2 8.8 M14 2l-4.3 12-2.5-5.2L2 6.3z"></path></svg></button>
</div>
</div>
</div>

<div role="dialog" aria-label="选择技能" style="position:absolute;left:14px;top:calc(100% + 8px);width:410px;max-width:calc(100% - 28px);background:#FFFFFF;border:1px solid #E6E8EC;border-radius:14px;box-shadow:0 14px 36px rgba(17,24,39,.13),0 2px 6px rgba(17,24,39,.06);z-index:10;overflow:hidden">
<div style="padding:10px 10px 4px">
<div style="position:relative">
<label class="sr" for="popSkillSearch">搜索技能</label>
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:11px;top:10px"><path d="M7 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z M10.3 10.3L13.5 13.5"></path></svg>
<input id="popSkillSearch" placeholder="搜索技能" style="width:100%;height:34px;box-sizing:border-box;border:1px solid #2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.14);border-radius:9px;padding:0 10px 0 32px;font-size:13px;background:#FFFFFF;color:#111827">
</div>
<div style="display:flex;justify-content:space-between;margin:10px 4px 4px;font-size:11.5px;color:#6B7280"><span>代码分析 · 4 个技能</span><span>一次用一个</span></div>
</div>
<div style="padding:0 6px 6px;display:flex;flex-direction:column;gap:2px">

<button style="display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:10px;padding:9px 10px;background:#F2F4F7;width:100%">
<span style="flex:none;width:30px;height:30px;border-radius:8px;background:#EEF3FE;color:#2563EB;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l6.2 3.2L8 8.2 1.8 5z M1.8 8L8 11.2 14.2 8 M1.8 11L8 14.2 14.2 11"></path></svg></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<span style="display:flex;align-items:center;gap:6px"><span style="font-size:13.5px;font-weight:600;color:#111827">性能审查</span><span style="font-size:10.5px;color:#4B5563;border:1px solid #D9DDE3;border-radius:5px;padding:0 4px;line-height:16px">v3</span></span>
<span style="font-size:12px;color:#4B5563;line-height:17px">按清单逐项查 LOOP 内 SELECT、FOR ALL ENTRIES 空表、SELECT * 等，按严重程度出表</span>
<span style="font-size:11.5px;color:#6B7280">工具：读源码 · 表结构</span>
</span>
<span style="flex:none;margin-top:6px;font-size:11px;color:#4B5563;border:1px solid #D9DDE3;border-radius:5px;padding:0 5px;line-height:17px;background:#FFFFFF">Enter</span>
</button>

<button style="display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:10px;padding:9px 10px;background:transparent;width:100%">
<span style="flex:none;width:30px;height:30px;border-radius:8px;background:#EEF3FE;color:#2563EB;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l6.2 3.2L8 8.2 1.8 5z M1.8 8L8 11.2 14.2 8 M1.8 11L8 14.2 14.2 11"></path></svg></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<span style="display:flex;align-items:center;gap:6px"><span style="font-size:13.5px;font-weight:600;color:#111827">代码解读</span><span style="font-size:10.5px;color:#4B5563;border:1px solid #E6E8EC;border-radius:5px;padding:0 4px;line-height:16px">v2</span></span>
<span style="font-size:12px;color:#4B5563;line-height:17px">先讲整体流程，再按子程序 / 方法拆开讲，最后列出读写了哪些表</span>
<span style="font-size:11.5px;color:#6B7280">工具：读源码</span>
</span>
</button>

<button style="display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:10px;padding:9px 10px;background:transparent;width:100%">
<span style="flex:none;width:30px;height:30px;border-radius:8px;background:#EEF3FE;color:#2563EB;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l6.2 3.2L8 8.2 1.8 5z M1.8 8L8 11.2 14.2 8 M1.8 11L8 14.2 14.2 11"></path></svg></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<span style="display:flex;align-items:center;gap:6px"><span style="font-size:13.5px;font-weight:600;color:#111827">增强出口定位</span><span style="font-size:10.5px;color:#4B5563;border:1px solid #E6E8EC;border-radius:5px;padding:0 4px;line-height:16px">v1</span></span>
<span style="font-size:12px;color:#4B5563;line-height:17px">找出程序里的 BAdI、用户出口和隐式增强点，并说明各自用途</span>
<span style="font-size:11.5px;color:#6B7280">工具：读源码</span>
</span>
</button>

<button style="display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;border-radius:10px;padding:9px 10px;background:transparent;width:100%">
<span style="flex:none;width:30px;height:30px;border-radius:8px;background:#EEF3FE;color:#2563EB;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l6.2 3.2L8 8.2 1.8 5z M1.8 8L8 11.2 14.2 8 M1.8 11L8 14.2 14.2 11"></path></svg></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<span style="display:flex;align-items:center;gap:6px"><span style="font-size:13.5px;font-weight:600;color:#111827">升级影响评估</span><span style="font-size:10.5px;color:#4B5563;border:1px solid #E6E8EC;border-radius:5px;padding:0 4px;line-height:16px">v1</span></span>
<span style="font-size:12px;color:#4B5563;line-height:17px">检查 S/4 不兼容写法和受影响的表（如 MKPF/MSEG → MATDOC），给出改动清单</span>
<span style="font-size:11.5px;color:#6B7280">工具：读源码 · 表结构</span>
</span>
