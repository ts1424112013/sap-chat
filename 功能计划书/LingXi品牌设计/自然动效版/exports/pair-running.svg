<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="lx-logo lx-pair" data-state="running" role="img" aria-label="LingXi 相伴标志">
  <style>
    .lx-pair { overflow: visible; }
    .lx-pair .pair-left { transform-box: view-box; transform-origin: 39px 87px; }
    .lx-pair .pair-right { transform-box: view-box; transform-origin: 82px 87px; }
    .lx-pair .pair-eye-left { transform-box: view-box; transform-origin: 44px 52px; }
    .lx-pair .pair-eye-right { transform-box: view-box; transform-origin: 75px 61px; }
    .lx-pair .pair-primary { fill: var(--mark-primary, #559D8B); }
    .lx-pair .pair-accent { fill: var(--mark-accent, #A7C8AE); }
    .lx-pair .pair-eye { fill: var(--mark-ink, #244C43); }
    .lx-pair[data-state="idle"] .pair-left { animation: pair-breathe-left 7.2s ease-in-out infinite; }
    .lx-pair[data-state="idle"] .pair-right { animation: pair-breathe-right 7.2s ease-in-out infinite; }
    .lx-pair[data-state="idle"] .pair-eye-left { animation: pair-blink 7.2s linear infinite; }
    .lx-pair[data-state="idle"] .pair-eye-right { animation: pair-blink 7.2s .6s linear infinite; }
    .lx-pair[data-state="thinking"] .pair-left { animation: pair-listen-left 5.4s ease-in-out infinite; }
    .lx-pair[data-state="thinking"] .pair-right { animation: pair-listen-right 5.4s ease-in-out infinite; }
    .lx-pair[data-state="thinking"] .pair-eye-left { animation: pair-think-blink 5.4s linear infinite; }
    .lx-pair[data-state="thinking"] .pair-eye-right { animation: pair-think-blink 5.4s 1.8s linear infinite; }
    .lx-pair[data-state="running"] .pair-left { animation: pair-pass-left 2.8s ease-in-out infinite; }
    .lx-pair[data-state="running"] .pair-right { animation: pair-pass-right 2.8s ease-in-out infinite; }
    .lx-pair[data-state="running"] .pair-eye-left { animation: pair-blink 8.4s linear infinite; }
    .lx-pair[data-state="running"] .pair-eye-right { animation: pair-blink 8.4s .5s linear infinite; }
    @keyframes pair-breathe-left {
      0%, 12%, 86%, 100% { transform: translateY(0) scale(1); }
      43% { transform: translateY(-.8px) scale(1.012, 1.018); }
    }
    @keyframes pair-breathe-right {
      0%, 21%, 96%, 100% { transform: translateY(0) scale(1); }
      55% { transform: translateY(-.7px) scale(1.012, 1.018); }
    }
    @keyframes pair-blink {
      0%, 62%, 66%, 100% { transform: scaleY(1); }
      63.5%, 64.5% { transform: scaleY(.12); }
    }
    @keyframes pair-listen-left {
      0%, 12%, 76%, 100% { transform: rotate(0) translateY(0); }
      28%, 43% { transform: rotate(4deg) translateY(-1px); }
      59% { transform: rotate(1deg) translateY(0); }
    }
    @keyframes pair-listen-right {
      0%, 34%, 93%, 100% { transform: rotate(0) translateY(0); }
      51%, 65% { transform: rotate(-4.5deg) translateY(-1px); }
      79% { transform: rotate(-1deg) translateY(0); }
    }
    @keyframes pair-think-blink {
      0%, 55%, 59%, 100% { transform: scaleY(1); }
      56.5%, 57.5% { transform: scaleY(.12); }
    }
    @keyframes pair-pass-left {
      0%, 10%, 53%, 100% { transform: translateY(0) rotate(0); }
      26%, 31% { transform: translateY(-3px) rotate(2.3deg); }
      44% { transform: translateY(-.4px) rotate(.5deg); }
    }
    @keyframes pair-pass-right {
      0%, 37%, 81%, 100% { transform: translateY(0) rotate(0); }
      54%, 59% { transform: translateY(-3px) rotate(-2.3deg); }
      72% { transform: translateY(-.4px) rotate(-.5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .lx-pair *, .lx-pair *::before, .lx-pair *::after { animation: none !important; transition: none !important; }
    }
  </style>
  <g class="pair-left">
    <path class="pair-primary" d="M19.2 64.6C19.2 48.8 24.3 29.1 35.8 25.1C45.8 21.6 55.1 30.7 55.8 43.2C56.3 52.7 51.2 61.7 52.8 70.8C54.1 78.4 54.1 88.4 47.1 93.1C39.8 98 28.8 93.3 23.6 84.5C20.5 79.3 19.2 72.3 19.2 64.6Z"/>
    <ellipse class="pair-eye pair-eye-left" cx="44" cy="52" rx="2.6" ry="3.5"/>
  </g>
  <g class="pair-right">
    <path class="pair-accent" d="M64.4 64.2C67.1 53.1 74.8 41.3 84.8 41.8C95.1 42.4 102.8 56.3 102.1 69.1C101.4 82.5 95.2 93.7 85.3 95.2C76 96.7 64.2 92.6 61.8 82.9C60.5 77.7 62.6 71.5 64.4 64.2Z"/>
    <ellipse class="pair-eye pair-eye-right" cx="75" cy="61" rx="2.6" ry="3.5"/>
  </g>
</svg>