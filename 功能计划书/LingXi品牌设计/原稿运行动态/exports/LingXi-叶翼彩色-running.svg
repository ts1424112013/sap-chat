<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 268" width="260" height="268" class="wing-mark" data-state="running" role="img" aria-label="灵犀叶翼标志">
        <defs>
          <linearGradient id="lingxi-wing-3-stem" x1="15" y1="200" x2="160" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#7563E8"/><stop offset=".5" stop-color="#508CF0"/><stop offset="1" stop-color="#43C5D6"/></linearGradient>
          <linearGradient id="lingxi-wing-3-upper" x1="96" y1="168" x2="239" y2="72" gradientUnits="userSpaceOnUse"><stop stop-color="#39B5BB"/><stop offset=".52" stop-color="#63C99D"/><stop offset="1" stop-color="#A9D987"/></linearGradient>
          <linearGradient id="lingxi-wing-3-lower" x1="121" y1="174" x2="242" y2="249" gradientUnits="userSpaceOnUse"><stop stop-color="#F1AF72"/><stop offset=".48" stop-color="#EF8D86"/><stop offset="1" stop-color="#DA76A4"/></linearGradient>
        </defs>
        <style>
        .wing-mark{overflow:visible}
        .wing-mark .wing-stem{transform-origin:66px 217px;transform-box:view-box}
        .wing-mark .wing-upper{transform-origin:99px 166px;transform-box:view-box}
        .wing-mark .wing-lower{transform-origin:122px 176px;transform-box:view-box}
        .wing-mark[data-state="running"] .wing-stem{animation:wing-stem-run 2.4s ease-in-out infinite}
        .wing-mark[data-state="running"] .wing-upper{animation:wing-upper-run 2.4s ease-in-out infinite}
        .wing-mark[data-state="running"] .wing-lower{animation:wing-lower-run 2.4s ease-in-out infinite}
        .wing-mark[data-state="thinking"] .wing-stem{animation:wing-stem-think 4.2s ease-in-out infinite}
        .wing-mark[data-state="thinking"] .wing-upper{animation:wing-upper-think 4.2s ease-in-out infinite}
        .wing-mark[data-state="thinking"] .wing-lower{animation:wing-lower-think 4.2s ease-in-out infinite}
        @keyframes wing-stem-run{0%,100%{transform:translateY(0) rotate(0) scale(1)}24%{transform:translateY(-4px) rotate(-2.5deg) scale(1.025,1.025)}61%{transform:translateY(2px) rotate(1.5deg) scale(.99,1.015)}84%{transform:translateY(-1px) rotate(-.6deg) scale(1.008)}}
        @keyframes wing-upper-run{0%,100%{transform:rotate(0) translate(0,0)}22%,30%{transform:rotate(-16deg) translate(8px,-4px)}53%{transform:rotate(3deg) translate(-2px,1px)}76%{transform:rotate(-4deg) translate(2px,-1px)}}
        @keyframes wing-lower-run{0%,100%{transform:rotate(0) translate(0,0)}21%{transform:rotate(-4deg) translate(-2px,0)}49%,60%{transform:rotate(16deg) translate(12px,-20px)}82%{transform:rotate(-2deg) translate(-1px,0)}}
        @keyframes wing-stem-think{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.012,1.025)}}
        @keyframes wing-upper-think{0%,100%{transform:rotate(0) translate(0,0)}32%,45%{transform:rotate(-7deg) translate(3px,-2px)}72%{transform:rotate(1.5deg) translate(0,0)}}
        @keyframes wing-lower-think{0%,100%{transform:rotate(0) translate(0,0)}24%{transform:rotate(-1.5deg) translate(0,0)}61%,73%{transform:rotate(6deg) translate(4px,-5px)}}
        @media(prefers-reduced-motion:reduce){.wing-mark *{animation:none!important;transform:none!important}}
        </style>
        <g class="wing-stem"><path fill="url(#lingxi-wing-3-stem)" d="M87 14C101 38 94 58 82 79C74 94 76 127 76 156L76 169C74 190 86 201 108 214L159 234H75C40 234 15 213 15 180V103C15 67 82 65 87 14Z"/></g>
        <g class="wing-upper"><path fill="url(#lingxi-wing-3-upper)" d="M98 158L151 105C178 78 201 72 239 72C215 97 181 124 144 145L102 169C95 173 91 169 98 158Z"/></g>
        <g class="wing-lower"><path fill="url(#lingxi-wing-3-lower)" d="M120 174C139 164 153 155 169 161C193 170 218 204 240 238C245 246 237 250 225 249C194 246 173 223 148 200L120 174Z"/></g>
      </svg>