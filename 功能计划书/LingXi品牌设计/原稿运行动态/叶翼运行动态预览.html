<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵犀 · 叶翼运行动效</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#24424d;background:#f1f4f5;font-synthesis:none;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:34px 36px 26px}h1{font-size:30px;font-weight:590;line-height:1.3;letter-spacing:-.04em;margin:0 0 10px}header p{font-size:16px;line-height:1.65;color:#526570;margin:0}header{margin-bottom:24px}button{font:inherit;font-size:14px;cursor:pointer;min-height:44px;border:0;color:inherit;transition:background-color .18s}button:focus-visible,a:focus-visible{outline:3px solid #218ccd;outline-offset:4px}button:hover{background:#e0e9ed}button:disabled{cursor:default;opacity:.6}.controls{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:20px}.states{background:#dfe8ec;display:flex;gap:3px;padding:4px;border-radius:7px}.states button{background:transparent;padding:9px 27px;border-radius:4px}.states button[aria-pressed=true]{background:#24424d;color:white}.actions{display:flex;gap:8px}.actions button{border:1px solid #d5dfe4;background:transparent;padding:10px 15px;border-radius:5px}.actions button[aria-pressed=true]{background:#dfe8ec}.hero{background:#fff;border-radius:12px;padding:45px 24px 24px}.brand-lockup{display:flex;align-items:center;justify-content:center;gap:36px;min-height:330px}.large-mark{width:254px;height:262px;flex-shrink:0}.wing-mark{display:block;width:100%;height:100%;overflow:visible}.wordmark{font-size:64px;font-weight:690;letter-spacing:-.045em;line-height:1.15}.wordmark span{display:block;font-size:31px;font-weight:550;letter-spacing:.08em;margin-top:10px}#status{text-align:center;font-size:15px;color:#526570;line-height:1.7;margin:25px 0 0;min-height:26px}.usage{display:grid;grid-template-columns:1.1fr .8fr 1.1fr;gap:18px;margin-top:18px}.usage>div{background:#fff;border-radius:10px;padding:20px 24px;min-height:157px}.usage h2{font-size:15px;font-weight:550;color:#526570;margin:0 0 18px}.sidebar-brand{display:flex;align-items:center;gap:9px;min-height:64px}.avatar{width:32px;height:33px;flex-shrink:0}.sidebar-brand strong{font-size:22px;letter-spacing:-.04em;font-weight:650}.small-state{font-size:13px;color:#526570;margin-left:12px}.app-tile{width:70px;height:70px;padding:7px;border-radius:16px;background:#24424d}.size-row{display:flex;gap:24px;align-items:center;min-height:64px}.size-item{display:flex;align-items:center;gap:7px;font-size:13px;color:#526570;font-variant-numeric:tabular-nums}.sample{display:block;width:var(--size);height:calc(var(--size)*1.03)}footer{display:flex;justify-content:space-between;gap:20px;margin-top:20px;font-size:13px;line-height:1.6;color:#526570}footer p{margin:0}a{color:#216c93;text-underline-offset:3px}.is-paused .wing-mark *,.is-hidden .wing-mark *{animation-play-state:paused!important}.dark-preview .hero{background:#24424d;color:#f5f8f9}.dark-preview #status{color:#d0dce1}
@media(max-width:850px){main{padding:28px}.controls{align-items:flex-start;flex-wrap:wrap}.brand-lockup{gap:20px;min-height:300px}.large-mark{width:218px;height:225px}.wordmark{font-size:52px}.wordmark span{font-size:27px}.usage{grid-template-columns:1fr 1fr}.usage-sizes{grid-column:1/-1}.usage>div{min-height:138px}.size-row{min-height:38px}footer{font-size:13px}}
@media(max-width:560px){main{padding:24px 18px}h1{font-size:25px}header p{font-size:14px}.controls{gap:12px}.states{width:100%}.states button{flex:1;padding:9px 14px}.actions{width:100%;gap:7px}.actions button{padding:9px 8px;font-size:13px;flex:1}.hero{padding:25px 15px 20px}.brand-lockup{gap:12px;min-height:220px}.large-mark{width:154px;height:159px}.wordmark{font-size:37px}.wordmark span{font-size:23px;margin-top:6px}#status{font-size:14px;margin-top:16px;min-height:48px}.usage{gap:12px;grid-template-columns:1fr 1fr}.usage>div{padding:17px 16px;min-height:130px}.usage h2{font-size:14px;margin-bottom:12px}.sidebar-brand{gap:5px;flex-wrap:wrap}.sidebar-brand strong{font-size:18px}.small-state{font-size:12px;margin-left:0;flex-basis:100%}.app-tile{width:59px;height:59px;padding:5px;border-radius:13px}.size-row{gap:24px;justify-content:space-between}.usage-sizes{grid-column:1/-1}footer{display:block}footer a{display:inline-block;margin-top:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<main>
  <header><h1>让这版灵犀，轻轻动起来。</h1><p>沿用你选的轮廓与蓝青渐变，让两片叶翼有先有后地回应。</p></header>
  <section class="controls" aria-label="动效控制">
    <div class="states" role="group" aria-label="工作状态"><button type="button" data-state="idle" aria-pressed="false">静止</button><button type="button" data-state="thinking" aria-pressed="false">思考</button><button type="button" data-state="running" aria-pressed="true">运行</button></div>
    <div class="actions"><button type="button" id="pause" aria-pressed="false">暂停动画</button><button type="button" id="demo" aria-pressed="false">模拟一次运行</button><button type="button" id="tone" aria-pressed="false">深色背景</button></div>
  </section>
  <section class="hero" aria-label="标志动态预览">
    <div class="brand-lockup"><div class="large-mark mark-slot" data-size="large"></div><div class="wordmark">LingXi<span>灵犀</span></div></div>
    <p id="status" role="status" aria-live="polite">运行中 · 两片叶翼依次舒展，主弧轻轻呼吸。</p>
  </section>
  <section class="usage" aria-label="实际尺寸效果">
    <div class="usage-brand"><h2>放进侧栏</h2><div class="sidebar-brand"><span class="avatar mark-slot" data-size="32"></span><strong>LingXi</strong><span class="small-state">运行中</span></div></div>
    <div class="usage-app"><h2>深色图标</h2><div class="app-tile mark-slot" data-size="64"></div></div>
    <div class="usage-sizes"><h2>缩小后看</h2><div class="size-row"><span class="size-item"><span class="sample mark-slot" data-size="32"></span>32px</span><span class="size-item"><span class="sample mark-slot" data-size="24"></span>24px</span><span class="size-item"><span class="sample mark-slot" data-size="16"></span>16px</span></div></div>
  </section>
  <footer><p>停止运行时，叶翼会柔和地回到原来的位置。</p><a href="exports/LingXi-叶翼-running.svg" id="download" download>下载当前状态的动态标志</a></footer>
  <noscript>请使用浏览器打开此文件并启用 JavaScript，或直接打开 exports 文件夹中的动态 SVG。</noscript>
</main>
<script>(function () {
  'use strict';
  let serial = 0;
  window.LingXiWing = {
    svg: function (state) {
      const id = 'lingxi-wing-' + (++serial);
      const safeState = ['idle','thinking','running'].includes(state) ? state : 'idle';
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 268" width="260" height="268" class="wing-mark" data-state="${safeState}" role="img" aria-label="灵犀叶翼标志">
        <defs>
          <linearGradient id="${id}-stem" x1="15" y1="200" x2="160" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#4289FF"/><stop offset=".52" stop-color="#35AFF3"/><stop offset="1" stop-color="#2CD0E2"/></linearGradient>
          <linearGradient id="${id}-upper" x1="96" y1="168" x2="239" y2="72" gradientUnits="userSpaceOnUse"><stop stop-color="#2EA4F5"/><stop offset="1" stop-color="#2BD0DF"/></linearGradient>
          <linearGradient id="${id}-lower" x1="121" y1="174" x2="242" y2="249" gradientUnits="userSpaceOnUse"><stop stop-color="#2FACFC"/><stop offset="1" stop-color="#4389FC"/></linearGradient>
        </defs>
        <style>
        .wing-mark{overflow:visible}
        .wing-mark .wing-stem{transform-origin:66px 217px;transform-box:view-box}
        .wing-mark .wing-upper{transform-origin:99px 166px;transform-box:view-box}
        .wing-mark .wing-lower{transform-origin:122px 176px;transform-box:view-box}
        .wing-mark[data-state="running"] .wing-stem{animation:wing-stem-run 3.6s ease-in-out infinite}
        .wing-mark[data-state="running"] .wing-upper{animation:wing-upper-run 3.6s ease-in-out infinite}
        .wing-mark[data-state="running"] .wing-lower{animation:wing-lower-run 3.6s ease-in-out infinite}
        .wing-mark[data-state="thinking"] .wing-stem{animation:wing-stem-think 5.6s ease-in-out infinite}
        .wing-mark[data-state="thinking"] .wing-upper{animation:wing-upper-think 5.6s ease-in-out infinite}
        .wing-mark[data-state="thinking"] .wing-lower{animation:wing-lower-think 5.6s ease-in-out infinite}
        @keyframes wing-stem-run{0%,10%,92%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-.65px) scale(1.008,1.015)}65%{transform:translateY(.3px) scale(1.003,.995)}}
        @keyframes wing-upper-run{0%,7%,61%,100%{transform:rotate(0) translate(0,0)}24%,34%{transform:rotate(-3.8deg) translate(.5px,-.6px)}46%{transform:rotate(-1deg) translate(0,0)}}
        @keyframes wing-lower-run{0%,31%,96%,100%{transform:rotate(0) translate(0,0)}51%,64%{transform:rotate(3.8deg) translate(.5px,.6px)}79%{transform:rotate(1deg) translate(0,0)}}
        @keyframes wing-stem-think{0%,100%{transform:scale(1)}50%{transform:scale(1.006,1.012)}}
        @keyframes wing-upper-think{0%,13%,85%,100%{transform:rotate(0)}36%,50%{transform:rotate(-2.2deg)}}
        @keyframes wing-lower-think{0%,36%,100%{transform:rotate(0)}60%,74%{transform:rotate(2.2deg)}}
        @media(prefers-reduced-motion:reduce){.wing-mark *{animation:none!important;transform:none!important}}
        </style>
        <g class="wing-stem"><path fill="url(#${id}-stem)" d="M87 14C101 38 94 58 82 79C74 94 76 127 76 156L76 169C74 190 86 201 108 214L159 234H75C40 234 15 213 15 180V103C15 67 82 65 87 14Z"/></g>
        <g class="wing-upper"><path fill="url(#${id}-upper)" d="M98 158L151 105C178 78 201 72 239 72C215 97 181 124 144 145L102 169C95 173 91 169 98 158Z"/></g>
        <g class="wing-lower"><path fill="url(#${id}-lower)" d="M120 174C139 164 153 155 169 161C193 170 218 204 240 238C245 246 237 250 225 249C194 246 173 223 148 200L120 174Z"/></g>
      </svg>`;
    }
  };
}());
</script><script>(function () {
  'use strict';
  const names={idle:'静止',thinking:'思考中',running:'运行中'};
  const notes={idle:'叶翼回到原位，保留原稿轮廓。',thinking:'叶翼慢慢侧倾，留一点思考的停顿。',running:'两片叶翼依次舒展，主弧轻轻呼吸。'};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  const pauseButton=document.getElementById('pause');
  const demoButton=document.getElementById('demo');
  let state='running',paused=false,token=0,demoTimer=null,demoActive=false;
  document.querySelectorAll('.mark-slot').forEach(slot=>{
    slot.innerHTML=window.LingXiWing.svg(state);
    if(/^\d+$/.test(slot.dataset.size))slot.style.setProperty('--size',slot.dataset.size+'px');
  });
  const marks=()=>[...document.querySelectorAll('.wing-mark')];
  const parts=()=>[...document.querySelectorAll('.wing-stem,.wing-upper,.wing-lower')];
  const ourAnimations=()=>document.getAnimations().filter(a=>a.effect?.target?.closest('.wing-mark'));
  function renderStatus(){
    document.getElementById('status').textContent=(reduce.matches?'已减少动态效果 · ':paused?'已暂停 · ':'')+names[state]+' · '+notes[state];
    document.querySelector('.small-state').textContent=names[state];
    document.querySelectorAll('[data-state]').forEach(button=>{
      if(button.tagName==='BUTTON')button.setAttribute('aria-pressed',String(button.dataset.state===state));
    });
    pauseButton.textContent=reduce.matches?'系统已减少动画':paused?'继续动画':'暂停动画';
    pauseButton.disabled=reduce.matches;demoButton.disabled=reduce.matches;
    pauseButton.setAttribute('aria-pressed',String(paused||reduce.matches));
    demoButton.textContent=demoActive?'结束这次演示':'模拟一次运行';
    demoButton.setAttribute('aria-pressed',String(demoActive));
    document.getElementById('download').href='exports/LingXi-叶翼-'+state+'.svg';
  }
  async function setState(next){
    const myToken=++token;
    state=Object.hasOwn(names,next)?next:'idle';
    renderStatus();
    const current=parts().map(el=>({el,transform:getComputedStyle(el).transform}));
    ourAnimations().forEach(animation=>animation.cancel());
    marks().forEach(svg=>svg.dataset.state='idle');
    if(!paused&&!reduce.matches){
      const settling=current.filter(x=>x.transform!=='none').map(({el,transform})=>el.animate([{transform},{transform:'none'}],{duration:300,easing:'cubic-bezier(.2,.7,.2,1)',fill:'both'}));
      await Promise.allSettled(settling.map(animation=>animation.finished));
      settling.forEach(animation=>animation.cancel());
    }
    if(myToken!==token)return;
    marks().forEach(svg=>svg.dataset.state=state);
  }
  function stopDemo(){clearTimeout(demoTimer);demoTimer=null;demoActive=false;renderStatus();}
  document.querySelectorAll('button[data-state]').forEach(button=>button.addEventListener('click',()=>{stopDemo();setState(button.dataset.state);}));
  pauseButton.addEventListener('click',()=>{
    paused=!paused;document.body.classList.toggle('is-paused',paused);
    ourAnimations().forEach(animation=>paused?animation.pause():animation.play());
    if(paused&&demoActive)stopDemo();
    renderStatus();
  });
  demoButton.addEventListener('click',()=>{
    if(demoActive){stopDemo();setState('idle');return;}
    paused=false;document.body.classList.remove('is-paused');
    demoActive=true;setState('running');
    demoTimer=setTimeout(()=>{demoActive=false;setState('idle');},8000);renderStatus();
  });
  document.getElementById('tone').addEventListener('click',event=>{
    const dark=document.body.classList.toggle('dark-preview');
    event.currentTarget.textContent=dark?'浅色背景':'深色背景';
    event.currentTarget.setAttribute('aria-pressed',String(dark));
  });
  document.getElementById('download').addEventListener('click',event=>{
    event.preventDefault();
    const svg=window.LingXiWing.svg(state);
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download='LingXi-叶翼-'+state+'.svg';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.addEventListener('visibilitychange',()=>{
    document.body.classList.toggle('is-hidden',document.hidden);
    ourAnimations().forEach(animation=>(document.hidden||paused)?animation.pause():animation.play());
  });
  reduce.addEventListener('change',()=>{
    if(reduce.matches){++token;stopDemo();ourAnimations().forEach(animation=>animation.cancel());marks().forEach(svg=>svg.dataset.state=state);}
    renderStatus();
  });
  document.body.classList.toggle('is-hidden',document.hidden);renderStatus();
}());
</script>
</body></html>
