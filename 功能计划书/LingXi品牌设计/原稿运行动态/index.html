<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵犀 · 彩色叶翼加强动效</title><link rel="stylesheet" href="preview.css"></head>
<body>
<main>
  <header><h1>让灵犀，动得更明显。</h1><p>叶翼展开幅度更大，主弧跟着起伏，运行节奏更清楚。</p></header>
  <section class="controls" aria-label="动效控制">
    <div class="states" role="group" aria-label="工作状态"><button type="button" data-state="idle" aria-pressed="false">静止</button><button type="button" data-state="thinking" aria-pressed="false">思考</button><button type="button" data-state="running" aria-pressed="true">运行</button></div>
    <div class="actions"><button type="button" id="pause" aria-pressed="false">暂停动画</button><button type="button" id="demo" aria-pressed="false">模拟一次运行</button><button type="button" id="tone" aria-pressed="false">深色背景</button></div>
  </section>
  <section class="hero" aria-label="标志动态预览">
    <div class="brand-lockup"><div class="large-mark mark-slot" data-size="large"></div><div class="wordmark">LingXi<span>灵犀</span></div></div>
    <p id="status" role="status" aria-live="polite">运行中 · 两片叶翼明显展开，主弧跟着起伏回应。</p>
  </section>
  <section class="usage" aria-label="实际尺寸效果">
    <div class="usage-brand"><h2>放进侧栏</h2><div class="sidebar-brand"><span class="avatar mark-slot" data-size="32"></span><strong>LingXi</strong><span class="small-state">运行中</span></div></div>
    <div class="usage-app"><h2>深色图标</h2><div class="app-tile mark-slot" data-size="64"></div></div>
    <div class="usage-sizes"><h2>缩小后看</h2><div class="size-row"><span class="size-item"><span class="sample mark-slot" data-size="32"></span>32px</span><span class="size-item"><span class="sample mark-slot" data-size="24"></span>24px</span><span class="size-item"><span class="sample mark-slot" data-size="16"></span>16px</span></div></div>
  </section>
  <footer><p>停止运行时，叶翼会柔和地回到原来的位置。</p><a href="exports/LingXi-叶翼彩色-running.svg" id="download" download>下载当前状态的彩色标志</a></footer>
  <noscript>请使用浏览器打开此文件并启用 JavaScript，或直接打开 exports 文件夹中的动态 SVG。</noscript>
</main>
<script src="mark.js"></script><script src="preview.js"></script>
</body></html>
