const NODS = [30.3, 82.6, 101.3, 120.7], HOPS = [[28.9, 56], [77.4, 14], [90.3, 64], [102.5, 46]], WAVE = [[31.3, 32.7], [122, 124.2]];
const hit = (L, t) => L.find((w) => t >= w[0] && t < w[1]);

function actor(t) {

// ───────── 播放控制 ─────────
const audio = $("music"), stage = $("stage");
let playing = false, base = 0, perf0 = 0, started = false;
const now = () => playing ? base + (performance.now() - perf0) / 1000 : base;
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(-50%,-50%) scale(${k})`;
  const r = Math.min(2, Math.max(1, k * (devicePixelRatio || 1))); cv.width = Math.round(W * r); cv.height = Math.round(H * r); render(); }
function render() { draw(clamp(now(), 0, T)); }
function seek(t) { base = clamp(t, 0, T); perf0 = performance.now(); try { audio.currentTime = base; } catch (e) {} render(); }
function play() { if (base >= T) base = 0; playing = true; perf0 = performance.now(); document.body.classList.add("playing"); try { audio.currentTime = base; } catch (e) {} audio.play().catch(() => {}); }
function pause() { base = now(); playing = false; audio.pause(); document.body.classList.remove("playing"); }
function loop() {
  if (playing) {
    if (!audio.paused && audio.readyState > 2) { const d = audio.currentTime - now(); if (Math.abs(d) > 0.15) base += d; }
    if (now() >= T) { base = T; playing = false; audio.pause(); document.body.classList.remove("playing"); }
    render();
  }
  requestAnimationFrame(loop);
}
function begin() { started = true; $("start").style.display = "none"; seek(0); play(); }
$("start").addEventListener("click", begin);
addEventListener("resize", fit);
addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); return; }
  if (!started) { if (e.key === " " || e.key === "Enter") begin(); return; }
  const t = now();
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "r" || e.key === "R") { seek(0); if (!playing) play(); }
  else if (e.key === "ArrowRight") seek(SECTIONS.find((s) => s > t + 0.1) ?? T);
  else if (e.key === "ArrowLeft") seek([...SECTIONS].reverse().find((s) => s < t - 1.5) ?? 0);
});
window.__seek = seek;
const at = new URLSearchParams(location.search).get("at");   // ?at=秒数：直接看某一刻的静止画面
if (at != null) { started = true; $("start").style.display = "none"; base = parseFloat(at) || 0; }
fit(); requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
