const LAST = "那么，你想问什么？";
function scEnd(t) { if (t < 112) return; GA = 1; const k1 = sm(114.4, 117.4, t), k2 = sm(118.6, 120.8, t);
  G(960, WMY, 560 + 200 * pulse(t, 116.2, 2.5), 0.2 * k1 + 0.35 * pulse(t, 116.2, 2.5));
  const gr = ctx.createLinearGradient(0, WMY - 110, 0, WMY + 110); gr.addColorStop(0, "#fff6e4"); gr.addColorStop(1, "#e2c08a");
  txt("灵犀", 960, WMY, 240, k1, gr, "center", SERIF, 400, 60); txt("让想法成为结果。", 960, 604, 38, k2, "#d9cdb4", "center", SERIF, 300, 12);
  GA = sm(123.4, 123.8, t); if (GA > 0) { const n = Math.floor(LAST.length * clamp((t - 123.6) / 1.5)), full = tw(LAST, 34, SERIF) + 5 * (LAST.length - 1), x = W / 2 - full / 2;
    txt(LAST.slice(0, n), x, 920, 34, 0.95, WARM, "left", SERIF, 400, 5); if ((t * 1.6) % 1 < 0.55) { ctx.globalAlpha = GA; ctx.fillStyle = GOLD; ctx.fillRect(x + (n ? tw(LAST.slice(0, n), 34, SERIF) + 5 * n : 0) + 6, 900, 3, 40); } } }

// ───────── 一帧 ─────────
function draw(t) {
  const r = cv.width / W; ctx.setTransform(r, 0, 0, r, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.drawImage(bg, 0, 0);
  GA = 1; for (const d of dust) G((d.x + t * 6 * d.d) % W, d.y, d.s * 5, d.a * 0.7 * (0.6 + 0.4 * Math.sin(t * d.f + d.p)));
  actor(t); sky(t);
  scOpen(t); scWall(t); scBirth(t); scWorld(t); scNight(t); scReturn(t); scEnd(t);
  drawActor();
  const fl = pulse(t, 73.35, 1.8); if (fl > 0.01) { ctx.globalAlpha = fl * 0.6; ctx.fillStyle = "#f6dfb4"; ctx.fillRect(0, 0, W, H); }                  // 走进门的那一下
  for (const [p, q, s] of CAPS) if (t > p && t < q) { GA = win(t, p, q, 0.5); const g = ctx.createLinearGradient(0, 860, 0, 1080); g.addColorStop(0, "rgba(5,7,10,0)"); g.addColorStop(0.6, "rgba(5,7,10,.75)"); g.addColorStop(1, "rgba(5,7,10,.9)");
    ctx.globalAlpha = GA; ctx.fillStyle = g; ctx.fillRect(0, 860, W, 220); txt(s, 960, 986 + 6 * (1 - GA), 36, 1, WARM, "center", SANS, 400, 3); }
  const blk = Math.max(1 - sm(0, 0.9, t), sm(127.6, 129.7, t)); if (blk > 0) { ctx.globalAlpha = blk; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;
}

// ───────── 播放控制 ─────────
const audio = $("music"), stage = $("stage");
let playing = false, base = 0, perf0 = 0, started = false;
const now = () => playing ? base + (performance.now() - perf0) / 1000 : base;
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(-50%,-50%) scale(${k})`;
  const r = Math.min(2, Math.max(1, k * (devicePixelRatio || 1))); cv.width = Math.round(W * r); cv.height = Math.round(H * r); render(); }
function render() { draw(clamp(now(), 0, T)); }
function seek(t) { base = clamp(t, 0, T); perf0 = performance.now(); try { audio.currentTime = base; } catch (e) {} render(); }
function play() { if (base >= T) base = 0; playing = true; perf0 = performance.now(); document.body.classList.add("playing"); try { audio.currentTime = base; } catch (e) {} audio.play().catch(() => {}); }
function pause() { base = now(); playing = false; audio.pause(); document.body.classList.remove("playing"); }
function loop() {
  if (playing) {
    if (!audio.paused && audio.readyState > 2) { const d = audio.currentTime - now(); if (Math.abs(d) > 0.15) base += d; }
    if (now() >= T) { base = T; playing = false; audio.pause(); document.body.classList.remove("playing"); }
    render();
  }
  requestAnimationFrame(loop);
}
function begin() { started = true; $("start").style.display = "none"; seek(0); play(); }
$("start").addEventListener("click", begin);
addEventListener("resize", fit);
addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); return; }
  if (!started) { if (e.key === " " || e.key === "Enter") begin(); return; }
  const t = now();
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "r" || e.key === "R") { seek(0); if (!playing) play(); }
  else if (e.key === "ArrowRight") seek(SECTIONS.find((s) => s > t + 0.1) ?? T);
  else if (e.key === "ArrowLeft") seek([...SECTIONS].reverse().find((s) => s < t - 1.5) ?? 0);
});
window.__seek = seek;
const at = new URLSearchParams(location.search).get("at");   // ?at=秒数：直接看某一刻的静止画面
if (at != null) { started = true; $("start").style.display = "none"; base = parseFloat(at) || 0; }
glyphs(); fit(); requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { glyphs(); render(); });
</script>
