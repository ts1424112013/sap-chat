<script>
"use strict";

// ───────── 基础 ─────────
const W = 1920, H = 1080, T = 16.8;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

{ const g = glow.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);

  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }

{ const g = bg.getContext("2d"); let gr = g.createLinearGradient(0, 0, W * 0.3, H);

const DR = rng(21), dust = Array.from({ length: 130 }, () => ({ x: DR() * W, y: DR() * H, d: 0.2 + DR() * 0.8, a: 0.1 + DR() * 0.3, f: 0.2 + DR() * 0.5, p: DR() * 6.28, s: 0.8 + DR() * 1.6 }));
let GA = 1;                                                  // 当前场景的整体透明度

function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  ctx.globalAlpha = clamp(a); ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = "middle";

  [[0, 0], [0, 20], [5, 15.5], [8.5, 23], [11.5, 21.5], [8, 14.5], [14, 14.5]].forEach(([px, py], i) => i ? ctx.lineTo(x + px * s, y + py * s) : ctx.moveTo(x + px * s, y + py * s)); ctx.closePath(); ctx.fill(); ctx.stroke(); }

  box(cx - w / 2, cy - h / 2, w, h, h * 0.42, a * 0.96, a * 0.8, gold ? "#221c12" : "#1b222e", gold ? GOLD : "#d97757", 1.4); txt(s, cx, cy + 1, size, a, WARM, "center"); }

// ───────── 试剪：踩错一条记录 → 找到对的那一行 → 递出第一份成果（16.8 秒） ─────────
// 音轨 trial.wav：以配乐 29.80–46.60 秒为底，重排鼓声。下面的时刻都是试剪内的秒数。
const BPT = 0.53141, bt = (k) => 0.0946 - 29.8 + BPT * k;     // 第 k 拍（实测拍子网格，误差约 2 毫秒）
const KA = 6.964, KB = 9.088, KF = 11.215, KC = 13.338;       // 三记重拍：托住、合表、交付；折文件是过渡
const SECTIONS = [0, 2.71, KA, KB, KF, KC];
const KEYS = [{ name: "托住脚", t: KA, act: "小人下落的脚，落在浮上来的那一行上", vis: "切回全景，正确记录托住小人，连出第一段路" },
  { name: "排成表", t: KB, act: "小人的脚落到对岸；六行记录同时停进表格的格子", vis: "切到表格，六行同时锁定，脚下的路留在画面里" },
  { name: "递出去", t: KC, act: "文件到达金色指针", vis: "镜头落在接收者身上，文件定住并出现「已收到」" }];
const ORANGE = "#d97757", EYE = "#17110e";
const GYT = 800, SEA0 = 430, SEA1 = 1250;
// 记录：[工厂, 日期, 订单]
const WANT = ["ABG1", "11.10"], ROWTXT = (r) => `${r[0]}   2026.${r[1]}   ${r[2]}`;
const R1 = { x: 590, y: 730, r: ["ABG1", "11.10", "100482311"] }, RW = { x: 800, y: 670, r: ["ABG2", "11.09", "100471906"] }, RC = { x: 800, r: ["ABG1", "11.10", "100482316"] };
const R3 = { x: 1000, y: 610, r: ["ABG1", "11.10", "100482317"] }, R4 = { x: 1150, y: 700, r: ["ABG1", "11.10", "100482318"] };
const CAND = [[560, 540, ["ABK1", "11.10", "100455120"], bt(65), 0], [1050, 520, ["ABG1", "11.08", "100479833"], bt(66), 1], [800, 470, ["ABG2", "11.10", "100480012"], bt(67), 0]];   // 它看过、又放下的三条：[x, y, 记录, 哪一拍看它, 哪一栏不对]
const TBL = { x: 455, y: 262, w: 670, rh: 48 }, FILEP = [790, 396], PTR = [1740, 615];
const TROWS = [R1.r, RC.r, R3.r, R4.r, ["ABG1", "11.10", "100482319"], ["ABG1", "11.10", "100482320"]];
function rowBox(cx, y, r, a, gold, bad = -1, w = 220) { if (a <= 0.004) return; const sv = GA; GA = sv * a; if (gold > 0) G(cx, y + 15, 170, 0.3 * gold);
  box(cx - w / 2, y, w, 30, 7, 0.96, 0.3 + 0.6 * gold, gold > 0.5 ? "#241d12" : "#141a24", bad >= 0 ? "rgb(170,96,88)" : GOLD, 1.3);
  const left = cx - w / 2;
  const xs = [left + w * 0.06, left + w * 0.30, left + w * 0.56], size = lerp(14, 23, clamp((w - 220) / 450));
  r.forEach((v, i) => txt(v, xs[i], y + 16, size, 0.98, i === bad ? "#ff9a80" : gold > 0.5 ? WARM : SUB, "left", MONO));
  GA = sv; }
function hillsT(off, base, amp, col, a) { ctx.globalAlpha = clamp(a * GA); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 40) { const wx = x + off; ctx.lineTo(x, base + Math.sin(wx * 0.0021) * amp + Math.sin(wx * 0.0057 + 1.3) * amp * 0.45); } ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); }
// 小人：每一次落脚的时刻都是一个拍点。hopTo(落脚时刻, 起点, 终点)：起跳在落脚前 0.34 秒
const A = { a: 0 };
const sinkAt = (t) => t < bt(63) ? 0 : 22 * (1 - Math.exp(-(t - bt(63)) * 9)) + [64, 65, 66, 67].reduce((s, k) => s + 7 * eo((t - bt(k)) / 0.12), 0);   // 踩错的那条：落上去就往下沉，每一拍再陷一点
const TBRK = 6.72;                                              // 踩错的记录碎掉的时刻（重击前约四分之一秒）
function feetY(t) { if (t < TBRK) return RW.y + sinkAt(t); if (t < KA) { const k = (t - TBRK) / (KA - TBRK); return RW.y + sinkAt(TBRK) + (780 - RW.y - sinkAt(TBRK)) * k * k; }
  const k = clamp((t - KA) / 0.34); return 780 - 158 * (1 - Math.pow(1 - k, 3)) - 14 * Math.sin(k * Math.PI) * (1 - k); }                              // 被接住，再被托高
const WK0 = bt(79) + 0.2, WK1 = bt(80) + 0.25;                 // 抱着文件走向那个人
function standAt(t) { if (t < bt(60)) return [lerp(90, 390, clamp((t - 0.2) / (bt(60) - 0.2))), GYT]; if (t < bt(61)) return [390, GYT]; if (t < bt(63)) return [R1.x, R1.y]; if (t < bt(71)) return [RW.x, feetY(t)];
  if (t < bt(72)) return [R3.x, R3.y]; if (t < KB) return [R4.x, R4.y]; if (t < WK0) return [1350, GYT]; return [lerp(1350, 1430, clamp((t - WK0) / (WK1 - WK0))), GYT]; }
const LANDS = [bt(61), bt(63), bt(71), bt(72), KB, bt(83)];     // 每一次落脚的时刻，都是一个拍点；起跳在落脚前 0.34 秒
function actor(t) { const o = { a: sm(0.1, 0.4, t), u: 12, ex: 1, ey: 0, aL: 0, aR: 0, rL: 0, rR: 0, lean: 0, crouch: 0, tuck: 0, yo: 0, legs: 0, blink: t % 3.3 < 0.12 }, p = standAt(t); o.x = p[0]; o.y = p[1];
  if ((t > 0.2 && t < bt(60)) || (t > WK0 && t < WK1)) o.legs = Math.floor((t - bt(56)) / (BPT / 2)) % 2 ? 1 : 2;                                      // 走路：每半拍换一次脚
  if (t >= bt(62) && t < bt(63) - 0.46) o.ey = -1;
  if (t >= bt(63) && t < KA) { o.ex = 0; o.ey = 1; if (t < bt(64)) o.lean = Math.floor((t - bt(63)) * 9) % 2 ? 1 : -1;                                // 晃一下，停住，找
    if (t >= bt(65) && t < bt(66)) { o.ex = -1; o.ey = -1; } else if (t >= bt(66) && t < bt(67)) { o.ex = 1; o.ey = -1; } else if (t >= bt(67) && t < bt(68)) { o.ex = 0; o.ey = -1; } else if (t >= bt(68) && t < TBRK) { o.ex = 0; o.ey = 0; o.lean = -1; }
    if (t >= TBRK) { o.tuck = 1; o.aL = -2; o.aR = -2; o.rL = 1; o.rR = 1; o.ey = 1; } }                                                               // 脚下一空，往下掉
  if (t >= KA && t < KA + 0.13) { o.crouch = 1; o.aL = -1; o.aR = -1; o.ey = 1; }
  if (t >= KB && t < bt(78)) { o.ex = -1; o.ey = -1; const k = Math.floor((t - bt(74)) / BPT); if (t >= bt(74) && k < 3 && t - bt(74 + k) < 0.3) { o.aL = -3; o.rL = 1; } }   // 回头看表，每一拍点一下、核一栏
  if (t >= bt(78) && t < 13.08) { if (t < bt(79)) { o.ex = -1; o.ey = -1; } if (t >= bt(78) + 0.3) { o.aL = -5; o.aR = -5; } if (t >= bt(79) && t < bt(79) + 0.1) o.crouch = 1; }   // 举手接住文件
  if (t >= 13.08 && t < KC) { o.crouch = 1; o.aL = -5; o.aR = -5; o.lean = -1; } else if (t >= KC && t < KC + 0.5) { o.aR = -2; o.rR = 1; o.aL = -2; o.lean = 1; }   // 往后一收，落拍时送出去
  for (const tl of LANDS) { const k = (t - (tl - 0.34)) / 0.34; if (t >= tl - 0.46 && t < tl - 0.34) o.crouch = 1; else if (t >= tl && t < tl + 0.09) o.crouch = 1;
    else if (k > 0 && k < 1) { const a = standAt(tl - 0.35), b = standAt(tl); o.x = lerp(a[0], b[0], k); o.y = lerp(a[1], b[1], k); o.yo = -(60 + Math.abs(b[1] - a[1]) * 0.3) * 4 * k * (1 - k); o.tuck = k > 0.12 && k < 0.88 ? 1 : 0; o.ex = 1; o.ey = 0; o.lean = 0; o.crouch = 0; } }
  if (t > 14.6 && t < 15.7) { o.aR = Math.floor((t - 14.6) * 5) % 2 ? -4 : -3; o.rR = 1; o.ex = 0; o.ey = 0; } else if (t >= 15.7) { o.ex = 0; o.ey = 0; }
  o.br = o.crouch || o.tuck || o.legs ? 0 : Math.round(1 + Math.sin(t * 2.1)); o.top = o.y + o.yo - 10 * o.u + (o.crouch ? o.u : 0); Object.assign(A, o); }
function drawActor() { if (A.a <= 0.004) return;
  const u = A.u, x0 = Math.round(A.x) - 8 * u, gy = Math.round(A.y + A.yo), bx = x0 + A.lean * u, bb = gy - (A.crouch ? u : 2 * u) - A.br, btp = bb - 8 * u;
  GA = 1; G(A.x, gy - 5 * u, 14 * u, 0.12 * A.a);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = A.a; ctx.fillStyle = ORANGE;
  ctx.fillRect(bx - A.rL * u, btp + (4 + A.aL) * u, (2 + A.rL) * u, 2 * u); ctx.fillRect(bx + 14 * u, btp + (4 + A.aR) * u, (2 + A.rR) * u, 2 * u);
  ctx.fillRect(bx + 2 * u, btp, 12 * u, 8 * u);
  [3, 5, 10, 12].forEach((c, j) => { const lift = A.tuck || (A.legs && j % 2 === A.legs - 1) ? u : 0; if (gy - bb - lift > 0) ctx.fillRect(x0 + c * u, bb, u, gy - bb - lift); });
  ctx.fillStyle = EYE; const eh = A.blink ? u : 2 * u, ey = btp + (2 + A.ey) * u + (A.blink ? u : 0);
  ctx.fillRect(bx + (4 + A.ex) * u, ey, u, eh); ctx.fillRect(bx + (11 + A.ex) * u, ey, u, eh); ctx.globalAlpha = 1; }
// 身后留下的星：每做成一件事，升起几颗
const SR = rng(9), STARS = [KA, KB, KC].flatMap((t0, g) => Array.from({ length: 5 }, (_, j) => ({ t0: t0 + 0.05 + j * 0.04, x: 260 + g * 560 + SR() * 300, y: 90 + SR() * 150, b: 0.5 + SR() * 0.5, f: 0.6 + SR() * 1.6, p: SR() * 6.28 })));
function ripple(x, y, t0, t) { const a = t - t0; if (a < 0 || a > 0.9) return; ctx.globalAlpha = (1 - a / 0.9) * 0.8; ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, y, 40 + a * 420, 8 + a * 60, 0, 0, 6.3); ctx.stroke(); }
function narr(t, t0, t1, x, y, s, size) { if (t <= t0 || t >= t1) return; const out = 1 - sm(t1 - 0.5, t1, t); ctx.save(); ctx.font = `400 ${size}px ${SERIF}`; ctx.shadowColor = "rgba(4,6,9,.95)"; ctx.shadowBlur = 24; ctx.textAlign = "left"; ctx.textBaseline = "middle"; let dx = 0;
  [...s].forEach((ch, i) => { const k = sm(t0 + i * 0.05, t0 + i * 0.05 + 0.45, t); ctx.globalAlpha = k * out; ctx.fillStyle = WARM; ctx.fillText(ch, x + dx, y + (1 - k) * 12); dx += ctx.measureText(ch).width + 4; }); ctx.restore(); }

let CHECK = new URLSearchParams(location.search).has("check"), SYNC = 0;      // 检查模式；人工校准的毫秒数（蓝牙耳机等有延迟的设备用）
try { SYNC = parseInt(localStorage.getItem("lingxiSync") || "0", 10) || 0; } catch (e) {}
function draw(t) {
  const r = cv.width / W;
  // 错行用近景。落拍切开空间，让新出现的路、表格和交付分别占住画面。
  let Z = 1, fx = 960, fy = 540;
  if (t < KA) {
    const approach = sm(3.45, 4.45, t);
    Z = lerp(1, 1.62, approach); fx = lerp(960, 780, approach); fy = lerp(540, 628, approach);
  } else if (t < KB) {
    Z = 1.04; fx = 900; fy = 560;
  } else if (t < KF) {
    Z = 1.29; fx = 876; fy = 501;
  } else if (t < KC) {
    const follow = sm(11.45, 12.96, t);
    Z = lerp(1.29, 1.20, follow); fx = lerp(876, 1250, follow); fy = 501;
  } else {

  }
  const ox = 960 - Z * fx, oy = 540 - Z * fy;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.drawImage(bg, 0, 0);
  ctx.setTransform(r * Z, 0, 0, r * Z, r * ox, r * oy);

    const src = [[R1.x, R1.y], [RC.x, 622], [R3.x, R3.y], [R4.x, R4.y], [640, 700], [980, 740]];

      if (land) { GA = (1 - fold); box(TBL.x - 16, TBL.y - 46, TBL.w + 32, 46 + 6 * TBL.rh * (1 - fold) + 14, 14, 0.9, 0.55, "#10151d"); ["工厂", "日期", "订单"].forEach((h, i) => { const hx = TBL.x + TBL.w * [0.06, 0.30, 0.56][i], ck = t >= bt(74 + i) ? 1 : 0;
          txt(h, hx, TBL.y - 22, 23, 0.95, ck ? GOLD : SUB); if (ck) { tick(hx + 63, TBL.y - 22, 19, sm(bt(74 + i), bt(74 + i) + 0.15, t)); G(hx + 30, TBL.y - 22, 80, 0.5 * pulse(t, bt(74 + i), 0.5)); } }); GA = 1; G(TBL.x + TBL.w / 2, TBL.y + 90, 520, 0.4 * pulse(t, KB, 0.8)); }

// 音频是播放时钟。暂停或跳看静帧时用手动定位的位置。
const audio = $("music"), stage = $("stage");
let playing = false, base = 0, started = false;
const now = () => playing && audio.readyState > 0 ? audio.currentTime : base;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
  const r = Math.min(2, Math.max(1, k * (devicePixelRatio || 1)));

}
function render() {
  const t = clamp(now() + SYNC / 1000, 0, T);

  if (!playing || audio.paused || audio.seeking) return;
  for (const key of KEYS) {

function seek(t) {

function play() {

    started = false;

}

$("start").addEventListener("click", (e) => {

addEventListener("resize", fit);
addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLAnchorElement) return;

if (at != null) { started = true; $("start").style.display = "none"; base = clamp(parseFloat(at) || 0, 0, T); }
fit(); requestAnimationFrame(loop);
