const CAPS = [[4.4, 6.5, "你好，我是灵犀。"], [6.8, 9.8, "住在你工作台里的 AI 伙伴。"],
  [10.6, 13.4, "告诉我，你想做什么。"], [13.8, 17.6, "我们从一句话开始。"],
  [19.6, 24.6, "我会先把你的需求理清楚。"],
  [27, 38.5, "找到报表，准备好查询条件。"], [41.8, 45.6, "你确认之后，我们继续。"],
  [52, 59.5, "把返回的数据整理清楚。"], [62, 70.5, "找到你真正关心的答案。"],
  [73.5, 81, "整理成表格，方便你查看。"], [84, 88.2, "也方便你带走。"],
  [89.6, 98, "我也能陪你看代码、理思路、写文档。"]];
const capS = $("capS"), scrim = $("scrim"), bn = $("bn"), bt = $("bt");
let lastTyped = -2, lastS = "";
function dom(t, ft) {                                        // t：画面时间；ft：片中时间
  const sent = t >= 6, late = t >= 60;
  const n = sent ? -1 : Math.floor(TASK.length * clamp((t - 0.9) / 4.3));
  if (n !== lastTyped) { lastTyped = n;
    el.inp.innerHTML = n < 0 ? '<span class="ph">继续说点什么…</span>' : n === 0 ? '<span class="ph">说出你想做的事…</span>' : TASK.slice(0, n) + '<span class="caret"></span>';
    el.send.className = "send" + (n > 0 ? " on" : ""); }
  const caret = el.inp.querySelector(".caret"); if (caret) caret.style.opacity = (t * 1.6) % 1 < 0.55 ? 1 : 0;
  el.send.style.transform = `scale(${1 - 0.12 * win(t, 5.55, 6.1, 0.25)})`;
  el.hero.style.opacity = 1 - sm(5.9, 6.5, t);
  const b = sm(6, 6.6, t); el.bubble.style.opacity = b; el.bubble.style.transform = `translateY(${(1 - b) * 30}px)`; el.cur.style.opacity = b;
  KW.forEach((k, i) => { const v = late ? 0 : sm(7.2 + i * 0.55, 7.8 + i * 0.55, t); k.el.style.color = `rgb(${lerp(233, 255, v)},226,${lerp(211, 170, v)})`; k.el.style.textShadow = v > 0 ? `0 0 ${14 * v}px rgba(230,197,143,${0.8 * v})` : "none"; });
  el.result.style.display = late ? "block" : "none";
  if (late) { rv.forEach((e, i) => { const k = sm(118 + i * 0.2, 118.8 + i * 0.2, t); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 10}px)`; });
    const ex = sm(128, 132, t), sc = 1 - 0.1 * ex;              // 谢幕：浏览器缓慢缩小、暗下
    el.br.style.opacity = sm(117.4, 119.6, t) * (1 - sm(128.4, 131.6, t)); el.br.style.transform = ex ? `translate(${W / 2 * (1 - sc)}px,${H / 2 * (1 - sc)}px) scale(${sc})` : "none"; }
  else { const e = sm(6.6, 9.4, t), z = 1 + (BZ - 1) * e;       // 镜头靠近消息卡片
    el.br.style.opacity = 1 - sm(10.2, 12, t);
    el.br.style.transform = e ? `translate(${lerp(bubC[0], BT[0], e) - bubC[0] * z}px,${lerp(bubC[1], BT[1], e) - bubC[1] * z}px) scale(${z})` : "none"; }
  let sa = 0;
  for (const [p, q, x] of CAPS) if (ft > p && ft < q) { sa = win(ft, p, q, 0.5); if (x !== lastS) { lastS = x; capS.textContent = x; } }
  capS.style.opacity = sa; capS.style.transform = `translateY(${(1 - sa) * 6}px)`;
  scrim.style.opacity = sa * sm(10.2, 12, t) * (1 - sm(117.4, 119.6, t));
  const out = 1 - sm(142.4, 143.7, t), k1 = sm(133, 135.4, t), k2 = sm(136.2, 138.6, t);
  bn.style.opacity = k1 * out; bn.style.transform = `translateY(${(1 - k1) * 12}px)`; bt.style.opacity = k2 * out;
  el.black.style.opacity = Math.max(sm(142.8, 143.9, t), 1 - sm(0.3, 1.8, ft));     // 开头：浏览器窗口亮起；结尾：淡出
}

// ───────── 播放控制 ─────────
const audio = $("music"), stage = $("stage");
let playing = false, base = 0, perf0 = 0, started = false;
const now = () => playing ? base + (performance.now() - perf0) / 1000 : base;
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(-50%,-50%) scale(${k})`;
  const r = Math.min(2, Math.max(1, k * (devicePixelRatio || 1))); cv.width = Math.round(W * r); cv.height = Math.round(H * r); render(); }
function render() { CT = clamp(now(), 0, T); const s = ot(CT); dom(s, CT); draw(s); }
function seek(t) { base = clamp(t, 0, T); perf0 = performance.now(); try { audio.currentTime = base; } catch (e) {} render(); }
function play() { if (base >= T) base = 0; playing = true; perf0 = performance.now(); document.body.classList.add("playing"); try { audio.currentTime = base; } catch (e) {} audio.play().catch(() => {}); }
function pause() { base = now(); playing = false; audio.pause(); document.body.classList.remove("playing"); }
function loop() {
  if (playing) {
    if (!audio.paused && audio.readyState > 2) { const d = audio.currentTime - now(); if (Math.abs(d) > 0.15) base += d; }
    if (now() >= T) { base = T; playing = false; audio.pause(); document.body.classList.remove("playing"); }
    render();
  }
  requestAnimationFrame(loop);
}
function begin() { started = true; $("start").style.display = "none"; seek(0); play(); }
$("start").addEventListener("click", begin);
addEventListener("resize", fit);
addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); return; }
  if (!started) { if (e.key === " " || e.key === "Enter") begin(); return; }
  const t = now();
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "r" || e.key === "R") { seek(0); if (!playing) play(); }
  else if (e.key === "ArrowRight") seek(SECTIONS.find((s) => s > t + 0.1) ?? T);
  else if (e.key === "ArrowLeft") seek([...SECTIONS].reverse().find((s) => s < t - 1.5) ?? 0);
});
window.__seek = seek;
const at = new URLSearchParams(location.search).get("at");   // ?at=秒数：直接看某一刻的静止画面
if (at != null) { started = true; $("start").style.display = "none"; base = parseFloat(at) || 0; }
measure(); fit(); requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); render(); });
</script>
