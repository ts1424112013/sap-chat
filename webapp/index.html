<!DOCTYPE html>
<html>
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Momo · 水沫</title>
        <link rel="icon" type="image/svg+xml" href="images/momo-favicon.svg">

        <!-- ================================================================
             V9：部署配置（后端地址/UI5来源的唯一事实源，详见 config.js 内注释）
             —— 必须在 UI5 引导之前加载
             ================================================================ -->
        <script src="config.js"></script>

        <!-- ================================================================
             V9.1 → V9.4：UI5 引导 —— 来源与主题由 config.js 决定：
             · ui5Src 缺省 = OpenUI5 CDN 1.130（构建版完整 loader）
             · 本地随包 = "./resources/sap-ui-core.js"（当前采用）
               ├ 开发：ui5 serve 从本地框架缓存提供（离线可用）
               └ 部署：dist/resources 自带完整运行时（离线可用）
             · 内网老服务器："/sap/public/bc/ui5_ui5/common/resources/sap-ui-core.js"
             ★ 引导必须用 document.write 同步写入（解析期执行）：
               ui5 serve 提供的 npm 源码版 sap-ui-core.js 依赖 document.write
               续接 ui5loader，createElement 动态插入时文档已解析完会被吞掉。
             ================================================================ -->
        <script>
                (function () {
                        var cfg = window.ZAI_CONFIG || {};
                        var sSrc = cfg.ui5Src || "https://sdk.openui5.org/1.130.0/resources/sap-ui-core.js";
                        document.write('<script id="sap-ui-bootstrap" src="' + sSrc + '"'
                                + ' data-sap-ui-theme="' + (cfg.ui5Theme || "sap_horizon") + '"'
                                + ' data-sap-ui-libs="sap.m, sap.ui.layout"'
                                + ' data-sap-ui-compatVersion="edge"'
                                + ' data-sap-ui-async="true"'
                                + ' data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"'
                                + ' data-sap-ui-resourceroots=\'{"zai.chat": "./"}\''
                                + '><\/script>');
                })();
        </script>

        <!-- ================================================================
             highlight.js：代码块语法高亮（V3.0）
             ★ V9.4：随包本地加载（webapp/thirdparty/hljs/），不再依赖公网 CDN：
             · highlight.min.js = 官方 common 套件（json/xml/sql/js 等 35 常用语）
             · abap.min.js = ABAP 语法包（v11 起从 common 剔除，独立维护：
               highlightjs/highlightjs-sap-abap），加载即自动注册
             · CDN 加载失败不影响功能的日子结束了：本地文件随 dist 一起部署
             · 控制器仍有 window.hljs 判空兜底，防御文件缺失
             ================================================================ -->
        <link rel="stylesheet" href="thirdparty/hljs/styles/github-dark-dimmed.min.css">
        <script src="thirdparty/hljs/highlight.min.js"></script>
        <script src="thirdparty/hljs/abap.min.js"></script>

        <style>
                html, body { margin: 0; padding: 0; height: 100%; }
                /* 组件容器铺满全屏 */
                [data-sap-ui-component] { height: 100%; }
        </style>

        <!-- ================================================================
             V4.3 输入模态跟踪（配合 style.css 聚焦框线策略，纯 UI）：
             按 Tab 键 → <html> 加 .zai-keynav，UI5 主题聚焦环正常显示
             （键盘导航无障碍保留）；鼠标按下 → 移除该类，点击后不留框线。
             说明：UI5 对列表项等是脚本接管 focus，:focus-visible 在鼠标
             点击后也会命中，无法区分模态，故用原生监听显式跟踪。
             ================================================================ -->
        <script>
                (function () {
                        var root = document.documentElement;
                        window.addEventListener('keydown', function (e) {
                                if (e.key === 'Tab') { root.classList.add('zai-keynav'); }
                        }, true);
                        window.addEventListener('mousedown', function () {
                                root.classList.remove('zai-keynav');
                        }, true);
                })();
        </script>

        <!-- ================================================================
             V6.0：主题预加载（防闪烁）
             在 UI5 引导前把 localStorage 里持久化的主题写到 <html> 根节点；
             默认亮色（简约版），切换按钮在顶栏（App.controller onToggleTheme）
             ================================================================ -->
        <script>
                (function () {
                        try {
                                var t = localStorage.getItem('zai.theme');
                                if (t !== 'light' && t !== 'dark') { t = 'light'; }
                                document.documentElement.setAttribute('data-theme', t);
                        } catch (e) {
                                document.documentElement.setAttribute('data-theme', 'light');
                        }
                })();
        </script>
</head>
<body class="sapUiBody" id="content">
        <!-- UI5 组件挂载点：data-name = 组件命名空间（与 manifest.json 的 sap.app.id 一致） -->
        <div data-sap-ui-component data-name="zai.chat" style="height: 100%"></div>
</body>
</html>
