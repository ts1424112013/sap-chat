<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵犀浏览器引擎自测</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 16px; background: #fff; color: #222; }
  pre { background: #f5f5f5; padding: 8px; white-space: pre-wrap; max-height: 360px; overflow: auto; }
  .ok { color: #0a7a3a; } .bad { color: #b00020; }
</style>
</head>
<body>
<h3>灵犀浏览器引擎自测（模拟 SAP + 浏览器私有存储当文件夹）</h3>
<button id="go">运行</button> <span id="state">未运行</span>
<h4>检查结果</h4><div id="checks"></div>
<h4>过程事件</h4><pre id="events"></pre>
<script src="/lingxi-agent.js"></script>
<script>
const $ = id => document.getElementById(id);
const events = [];
const checks = [];
function check(name, ok, detail) { checks.push({ name, ok, detail }); $("checks").innerHTML = checks.map(c => `<div class="${c.ok ? "ok" : "bad"}">${c.ok ? "✔" : "✘"} ${c.name}${c.detail ? " — " + c.detail : ""}</div>`).join(""); }
async function text(dir, path) {
  let d = dir; const parts = path.split("/").filter(Boolean);
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
  return (await (await d.getFileHandle(parts[parts.length - 1])).getFile()).text();
}
async function main() {
  $("state").textContent = "运行中…";
  const root = await navigator.storage.getDirectory();
  // 每次干净开始
  for await (const [name] of root.entries()) await root.removeEntry(name, { recursive: true });
  const f = await root.getFileHandle("工单.csv", { create: true });
  const w = await f.createWritable(); await w.write("工单,状态\n1001,未完工\n1002,未完工\n"); await w.close();

  const netBefore = performance.getEntriesByType("resource").length;
  const confirms = [];
  window.__result = null;
  try {
    const r = await LingxiAgent.run({
      question: "把 1001 改成已完工，写个汇总",
      folder: root,
      sap: { base: "/sap/bc/zai_agent" },
      onEvent: e => { events.push(e); $("events").textContent = events.map(x => JSON.stringify(x)).join("\n"); },
      confirm: async req => { confirms.push(req.action + " " + req.path); return true; }
    });
    window.__result = r;
    check("回答", /完成/.test(r.answer), r.answer);
    check("待办清单出现并更新", events.filter(e => e.type === "todos").length >= 2);
    check("调了 SAP 工具", events.some(e => e.type === "tool_end" && e.tool === "search_tables" && e.ok));
    check("读了文件", events.some(e => e.type === "tool_end" && e.tool === "read_file" && /1001/.test(e.preview)));
    check("改文件前确认 3 次", confirms.length === 3, JSON.stringify(confirms));
    check("CSV 被改", (await text(root, "/工单.csv")).includes("1001,已完工"));
    check("汇总新建", (await text(root, "/汇总.md")).includes("工单汇总"));
    check("记忆文件写入", (await text(root, "/灵犀记忆.md")).includes("灵犀记忆"));
    const bk = await (await root.getDirectoryHandle(".lingxi")).getDirectoryHandle("备份");
    let backupOk = false;
    for await (const [, sess] of bk.entries()) backupOk = (await text(sess, "/工单.csv")).includes("1001,未完工");
    check("改之前有备份（原内容）", backupOk);
    check("修改记录", (await text(root, "/.lingxi/修改记录.md")).split("\n").filter(l => l.startsWith("| 20")).length === 3);
    const undo = await r.folder.undoLast();
    let memGone = false; try { await text(root, "/灵犀记忆.md"); } catch (e) { memGone = true; }
    check("撤回最后一次（新建的记忆文件被删）", !undo.error && memGone, JSON.stringify(undo));
    const res = performance.getEntriesByType("resource").slice(netBefore).map(e => e.name);
    const foreign = res.filter(u => !u.startsWith(location.origin));
    check("没有外网请求", foreign.length === 0, foreign.join(", "));
    const log = await (await fetch("/__log")).json();
    check("SAP 请求都带头、无 Authorization", log.every(l => l.headers.agent === "1" && !l.headers.auth));
    check("模型调用都带运行号", log.filter(l => l.path === "/chat/completions").every(l => l.headers.run));
    // ---- 场景二：已有记忆文件、子 Agent、用户拒绝修改 ----
    const mf = await root.getFileHandle("灵犀记忆.md", { create: true });
    const mw = await mf.createWritable(); await mw.write("# 灵犀记忆\n\n- MARKER-42 工单号一律四位\n"); await mw.close();
    const before2 = await text(root, "/工单.csv");
    const r2 = await LingxiAgent.run({
      question: "场景二", folderBackend: r.folder, sap: { base: "/sap/bc/zai_agent" },
      onEvent: e => events.push(e),
      confirm: async req => ({ approved: false, message: "先别改" })
    });
    const flags = JSON.parse(r2.answer.replace(/^FLAGS /, ""));
    check("下次运行读到记忆文件", flags.memory, r2.answer);
    check("子 Agent 返回结果", flags.subagent);
    check("拒绝修改后 Agent 收到拒绝说明", flags.rejected);
    check("SAP 工具返回 ok:false 时运行继续、原因交给模型", flags.toolErr);
    check("拒绝后文件没变", (await text(root, "/工单.csv")) === before2);
    // ---- 场景三：技能（SAP + 文件夹）+ 结果存到文件夹 + 报表参数卡 ----
    const sk = await (await (await root.getDirectoryHandle(".lingxi")).getDirectoryHandle("技能", { create: true })).getDirectoryHandle("项目口径", { create: true });
    const skw = await (await sk.getFileHandle("SKILL.md", { create: true })).createWritable();
    await skw.write("---\nname: 项目口径\ndescription: 本项目的库存口径\n---\n\n库存按可用库存算\n"); await skw.close();
    const ev3 = [];
    const confirms3 = [];
    const r3 = await LingxiAgent.run({
      question: "场景三", folderBackend: r.folder, sap: { base: "/sap/bc/zai_agent" },
      onEvent: e => { ev3.push(e); events.push(e); },
      confirm: async req => { confirms3.push(req.action + " " + req.path); return true; }
    });
    const runs = await (await fetch("/__runs")).json();
    const run3 = Object.values(runs).find(x => x.question === "场景三") || {};
    check("系统提示里列出 SAP 技能", run3.sysHasSapSkill);
    check("系统提示里列出文件夹技能", run3.sysHasFolderSkill);
    check("读到 SAP 技能正文", run3.skillRead);
    check("技能使用写回 SAP（skillsUsed）", JSON.stringify(run3.skillsUsed) === '["SK1"]', JSON.stringify(run3.skillsUsed));
    check("有选文件夹时才有导出工具", run3.hasExportTool);
    const csv = await text(root, "/导出/库存.csv");   // .text() 会吃掉 BOM，BOM 看原始字节
    const head = new Uint8Array(await (await (await (await root.getDirectoryHandle("导出")).getFileHandle("库存.csv")).getFile()).slice(0, 3).arrayBuffer());
    check("结果存成 CSV（带 BOM，数据来自 SAP）", head[0] === 0xEF && head[1] === 0xBB && head[2] === 0xBF && csv.includes('M2,"1,200"'), JSON.stringify(csv.slice(0, 40)));
    check("存文件前确认", confirms3.length === 1 && confirms3[0] === "新建 /导出/库存.csv", JSON.stringify(confirms3));
    check("拿到参数卡即停（模型只调 4 次）", run3.modelCalls === 4, "modelCalls=" + run3.modelCalls);
    check("参数卡交回界面", r3.card && r3.card.taskId === "T1" && /请填参数/.test(r3.answer), r3.answer);
    check("参数卡写回会话", run3.status === "OK" && /请填参数/.test(run3.answer || ""));
    check("技能事件", ev3.some(e => e.type === "skill" && e.name === "库存盘点"));
    check("工具带回的数据集交给界面", Array.isArray(r3.datasets) && r3.datasets.length === 1 && r3.datasets[0].name === "库存结果");
    // ---- 场景四：SAP 确定性回答（Fiori 参数卡），不调模型 ----
    const r4 = await LingxiAgent.run({ question: "场景四", context: { focusArtifactId: "FA1" }, sap: { base: "/sap/bc/zai_agent" }, onEvent: e => events.push(e) });
    const runs4 = await (await fetch("/__runs")).json();
    const run4 = Object.values(runs4).find(x => x.question === "场景四") || {};
    check("确定性回答：不调模型、直接带回参数卡", run4.modelCalls === 0 && r4.card && r4.card.taskModule === "FIORI" && /Fiori 报表/.test(r4.answer), JSON.stringify({ calls: run4.modelCalls, a: r4.answer }));
    check("确定性回答写回会话；聚焦结果号带到 SAP", run4.status === "OK" && run4.focus === "FA1");
    // ---- 场景六：上下文压缩（按中文比例提前压缩 + 网关报超出上下文时压缩重试） ----
    const plan = LingxiAgent.contextPlan(256000);
    check("压缩时机按中文折算（256K → 约 7 万估算 token）", plan.trigger === 69818 && plan.trimToSummarize === 46545, JSON.stringify(plan));
    const ev6 = [];
    const r6 = await LingxiAgent.run({ question: "场景六", sap: { base: "/sap/bc/zai_agent" }, onEvent: e => { ev6.push(e); events.push(e); } });
    const run6 = Object.values(await (await fetch("/__runs")).json()).find(x => x.question === "场景六") || {};
    check("中文大结果累积到阈值就自动压缩（用中文总结提示）", run6.summaries >= 1 && run6.summaryPromptChars > 0 && ev6.some(e => e.type === "compacted"),
      JSON.stringify({ summaries: run6.summaries, compacted: ev6.filter(e => e.type === "compacted").length }));
    check("压缩后后续请求带的是总结", run6.sawSummary === true);
    // ---- 场景七：界面改版要的事件（节点说明、思考、用量、结果句、本次都允许、精简过程记录） ----
    const ev7 = [];
    let asked7 = 0;
    const r7 = await LingxiAgent.run({ question: "场景七", folderBackend: r.folder, sap: { base: "/sap/bc/zai_agent" },
      onEvent: e => { ev7.push(e); events.push(e); },
      confirm: async () => { asked7++; return { approved: true, always: true }; } });
    const run7 = Object.values(await (await fetch("/__runs")).json()).find(x => x.question === "场景七") || {};
    check("提示词里有「过程说明」规则", run7.sysHasNarrationRule === true);
    check("节点说明 say 事件（完整文字）", ev7.some(e => e.type === "say" && e.text === "先查工单相关的表，再统计。"));
    check("深度思考 think 事件", ev7.some(e => e.type === "think" && /先找表/.test(e.text)));
    check("用量 usage 事件", ev7.some(e => e.type === "usage" && e.input === 1234 && e.ctx > 0));
    check("工具行带主要参数与一句话结果", ev7.some(e => e.type === "tool_start" && e.arg === "工单") &&
      ev7.some(e => e.type === "tool_end" && e.tool === "search_tables" && /共 2 条/.test(e.summary)), JSON.stringify(ev7.filter(e => e.type === "tool_end").map(e => e.summary)));
    check("「本次都允许」：只问一次，第二次写入自动通过", asked7 === 1 && ev7.some(e => e.type === "confirmed" && e.auto === true) && /完成 场景七/.test(r7.answer));
    const st7 = run7.steps || [];
    check("精简过程记录交给 SAP（说明 / 工具 / 确认）", st7.some(s => s.k === "say") && st7.some(s => s.k === "tool" && s.tool === "search_tables" && s.st === "OK" && s.sum) &&
      st7.some(s => s.k === "note" && /自动/.test(s.text)) && st7.some(s => s.k === "think") && !JSON.stringify(st7).includes("先找表"), JSON.stringify(st7).slice(0, 400));
    // ---- 场景八：不清楚就问（ask_user） ----
    const ev8 = [];
    let q8 = null;
    const r8 = await LingxiAgent.run({ question: "场景八A", sap: { base: "/sap/bc/zai_agent" }, onEvent: e => ev8.push(e),
      ask: async q => { q8 = q; return { answer: "客戶料號" }; } });
    const run8 = Object.values(await (await fetch("/__runs")).json()).find(x => x.question === "场景八A") || {};
    check("有问用户界面时：提示词有「不清楚就先问」、工具里有 ask_user", run8.sysHasAskRule === true && run8.hasAskTool === true);
    check("ask_user 把问题和候选交给界面，用户选的回给模型", q8 && q8.options.length === 2 && /用户选择：客戶料號/.test(r8.answer), r8.answer);
    check("问答记进精简过程记录（不另记工具行）", (run8.steps || []).some(s => s.k === "note" && /问：.*客戶料號/.test(s.text)) &&
      !(run8.steps || []).some(s => s.k === "tool" && s.tool === "ask_user"), JSON.stringify(run8.steps));
    const r8b = await LingxiAgent.run({ question: "场景八B", sap: { base: "/sap/bc/zai_agent" }, ask: async () => ({ other: true }) });
    const run8b = Object.values(await (await fetch("/__runs")).json()).find(x => x.question === "场景八B") || {};
    check("选「我直接说」：立即停，问题就是回答，不再调模型", run8b.modelCalls === 1 && run8b.status === "OK" && /要带哪一列/.test(r8b.answer), JSON.stringify({ calls: run8b.modelCalls, a: r8b.answer }));
    const r8c = await LingxiAgent.run({ question: "场景八C", sap: { base: "/sap/bc/zai_agent" } });
    const run8c = Object.values(await (await fetch("/__runs")).json()).find(x => x.question === "场景八C") || {};
    check("没有问用户界面时不给 ask_user", run8c.hasAskTool === false && run8c.sysHasAskRule === false);
    check("SAP 没开 ADT 时不给 adt_ 工具", run8c.hasAdtTools === false && run8c.sysHasAdtRule === false);
    // ---- 场景九：ADT 代码工具 ----
    const ev9 = [];
    const r9 = await LingxiAgent.run({ question: "场景九 看看 ZCL_AI_AGENT_SERVICE", sap: { base: "/sap/bc/zai_agent" }, title: true, onEvent: e => ev9.push(e) });
    const run9 = Object.values(await (await fetch("/__runs")).json()).find(x => /场景九/.test(x.question)) || {};
    const adt9 = await (await fetch("/__adt")).json();
    const t9 = run9.toolTexts9 || [];
    check("ADT：SAP 回 adt:true 时挂上 6 个 adt_ 工具和用法说明", run9.hasAdtTools === true && run9.sysHasAdtRule === true && /完成 场景九/.test(r9.answer));
    check("ADT 搜索：解析对象名、类型、包、地址", /找到 2 个对象/.test(t9[0]) && /ZCL_AI_AGENT_SERVICE\s+类\s+包 ZIDPPP/.test(t9[0]) && /\/sap\/bc\/adt\/oo\/classes\/zcl_ai_agent_http/.test(t9[0]), t9[0]);
    check("ADT 结构：给名字也能用（先按名字找地址），带行号", /BROWSER_START\s+CLAS\/OM public\s+行 3/.test(t9[1]), t9[1]);
    check("ADT 读源码：keyword 只给命中行和前后文，带行号", /命中 2 处/.test(t9[2]) && /\s7\s+METHOD browser_start\./.test(t9[2]), t9[2]);
    check("ADT 读源码：分页", /第 3–4 行/.test(t9[3]) && /还有 6 行，继续读用 start_line=5/.test(t9[3]), t9[3]);
    check("ADT 被谁使用：只列结果对象，不含包节点", /共 2 个/.test(t9[4]) && /ZCL_AI_DPC_EXT/.test(t9[4]) && !/^ZIDPPP\s/m.test(t9[4]) && adt9.whereUsedUri === "/sap/bc/adt/oo/classes/zcl_ai_agent_service", t9[4]);
    check("ADT 包内容：按类型分组", /包 ZIDPPP 共 3 个对象/.test(t9[5]) && /【表】1 个/.test(t9[5]), t9[5]);
    check("ADT 语法检查：令牌过期时重取一次再成功，只查已激活版本", /警告 \/ 提示 1 个/.test(t9[6]) && /行 8/.test(t9[6]) && adt9.fetches === 2 && /version="active"/.test(adt9.checkBody || ""), t9[6] + " fetches=" + adt9.fetches);
    check("ADT 白名单：datapreview 地址直接拒绝，不发请求、不记审计", /不在允许范围内/.test(t9[7]) && !adt9.log.some(l => /datapreview/.test(l.path)) && !adt9.audits.some(a => /datapreview/.test(a.target)), t9[7]);
    check("ADT 没权限：如实转告，审计记 DENIED", /没有权限/.test(t9[8]) && adt9.audits.some(a => a.target === "ZCL_SECRET" && a.status === "DENIED"), t9[8]);
    check("ADT 域：返回类型和固定值", /CHAR 长度 1/.test(t9[9]) && /H\s+Haben/.test(t9[9]) && /固定值（2 个）/.test(t9[9]), t9[9]);
    check("ADT 审计：每次调用先报（计入工具次数）、调完回填状态；请求不带灵犀头和 Authorization",
      adt9.audits.length === 9 && adt9.audits.every(a => a.status !== "CALL") &&
      adt9.log.every(l => !l.auth && !l.agentHdr) && adt9.log.filter(l => l.method === "POST").every(l => l.csrf),
      JSON.stringify(adt9.audits.map(a => a.tool + ":" + a.status)));
    check("会话标题：回答后让模型起标题，清掉前缀 / 引号 / 句号，交给 SAP 收尾并返回界面",
      run9.titleCalls === 1 && r9.title === "ZCL_AI_AGENT_SERVICE 结构与调用方" && run9.title === r9.title &&
      ev9.some(e => e.type === "title") && /用户的问题：场景九/.test(run9.titleUserMsg || "") && /助手的回答/.test(run9.titleUserMsg || ""),
      JSON.stringify({ calls: run9.titleCalls, t: r9.title, saved: run9.title }));
    check("没要标题时不多调模型", !run8c.titleCalls && !run8c.title);
    const st9 = (run9.steps || []).filter(s => s.k === "tool");
    check("ADT 过程记录：一句话结果", st9.some(s => s.tool === "adt_where_used" && /被 2 个对象使用/.test(s.sum)) &&
      st9.some(s => s.tool === "adt_syntax_check" && /错误 0 个，警告 1 个/.test(s.sum)), JSON.stringify(st9.map(s => s.sum)));
    check("网关报超出上下文：压缩后重试，运行照常完成", run6.overflowSent === true && /完成 场景六/.test(r6.answer) && run6.status === "OK", r6.answer);
    $("state").textContent = checks.every(c => c.ok) ? "全部通过" : "有失败";
  } catch (e) {
    check("运行", false, (e && e.stack) || e);
    $("state").textContent = "出错";
  }
  window.__checks = checks;
}
$("go").onclick = main;
</script>
</body>
</html>
